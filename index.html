    { term:'Revit API', it:'Interfaccia di programmazione di Autodesk Revit per accedere agli elementi e alle funzionalità dell’applicazione.', en:'Autodesk Revit’s programming interface for accessing application elements and operations.' },
    { term:'Read-only', it:'Modalità che permette di leggere informazioni senza modificare il modello.', en:'A mode that permits reading information without changing the model.' }

  lessons: [
    {
      id:'e1', mins:5, title:{it:'Che cos’è MCP?',en:'What is MCP?'}, subtitle:{it:'Perché collegare l’AI agli strumenti esterni',en:'Why connect AI to external tools'},
      goals:{it:['Distinguere tra spiegare ed eseguire un’operazione','Definire il ruolo dello standard MCP','Riconoscere opportunità e limiti'],en:['Distinguish explaining from executing an action','Define what the MCP standard does','Recognize opportunities and limitations']},
      steps:[
        {id:'e1s1',title:{it:'Il problema da risolvere',en:'The problem we need to solve'},blocks:{
          it:[{type:'p',text:'Immagina di chiedere a un assistente AI: **«Quante pareti ci sono nel mio modello Revit aperto?»**. Senza un collegamento al progetto, l’assistente può spiegarti come contare le pareti, suggerire un abaco o scrivere codice, ma **non può conoscere il numero reale**.'},{type:'p',text:'Per ottenere quel dato deve raggiungere il programma che lo possiede, eseguire un’operazione e ricevere un risultato attendibile. Il problema non è soltanto comprendere il linguaggio naturale: è **collegare due sistemi**.'},{type:'note',title:'Idea chiave',text:'Una risposta ben scritta non equivale a un dato effettivamente letto dal modello BIM.'}],
          en:[{type:'p',text:'Imagine asking an AI assistant: **“How many walls are in my open Revit model?”** Without a connection to your project, the assistant can explain how to count walls, suggest a schedule or write code, but **cannot know the actual count**.'},{type:'p',text:'To obtain that value, it must reach the application holding the data, execute an operation, and receive a trustworthy result. The challenge is not just understanding language: it is **connecting two systems**.'},{type:'note',title:'Key idea',text:'A well-written answer is not the same as data actually retrieved from the BIM model.'}]
        }},
        {id:'e1s2',title:{it:'La definizione di MCP',en:'Defining MCP'},blocks:{
          it:[{type:'p',text:'**Model Context Protocol (MCP)** è uno standard aperto che definisce come un’applicazione possa rendere disponibili strumenti e informazioni a un’altra applicazione, spesso un assistente AI. Consente di scoprire capacità, invocare funzioni e scambiare risultati attraverso messaggi strutturati.'},{type:'p',text:'MCP **non è un modello linguistico**, non è un’applicazione di progettazione e non sostituisce le API di Revit. È la convenzione che permette di comunicare con strumenti già implementati.'},{type:'bullets',items:['Il **client** invia richieste attraverso MCP.','Il **server** espone strumenti e dati.','Il **software esterno** conserva la propria logica e i propri dati.']},{type:'source',ids:['mcp','arch']}],
          en:[{type:'p',text:'**Model Context Protocol (MCP)** is an open standard defining how an application exposes tools and information to another application, often an AI assistant. It supports capability discovery, function calls, and structured responses.'},{type:'p',text:'MCP is **not a language model**, not a design application, and not a replacement for the Revit API. It is the convention used to communicate with capabilities that software already implements.'},{type:'bullets',items:['A **client** sends MCP requests.','A **server** exposes tools and data.','The **external application** retains its own logic and data.']},{type:'source',ids:['mcp','arch']}]
        }},
        {id:'e1s3',title:{it:'Con e senza MCP',en:'With and without MCP'},blocks:{
          it:[{type:'p',text:'Il vantaggio si comprende meglio confrontando la stessa domanda in due situazioni. Usa il selettore qui sotto: è una **simulazione**, non un collegamento a un’AI o a Revit.'},{type:'interactive',widget:'comparison'},{type:'note',title:'Attenzione',text:'Anche quando è disponibile MCP, l’AI può sbagliare la scelta del Tool o interpretare male il risultato. Il dato deve essere verificabile.'}],
          en:[{type:'p',text:'The difference becomes clearer if we compare the same question in two settings. Try the switch below: this is a **simulation**, not an active connection to an AI model or Revit.'},{type:'interactive',widget:'comparison'},{type:'note',title:'Remember',text:'Even with MCP, an AI model may choose the wrong tool or misinterpret its output. The result must remain verifiable.'}]
        }},
        {id:'e1s4',title:{it:'Dove si può utilizzare?',en:'Where can it be used?'},blocks:{
          it:[{type:'p',text:'L’utilità di MCP non si limita al BIM. Un assistente può, tramite server appropriati, interrogare un database, consultare documenti, interagire con strumenti di sviluppo o leggere dati da un modello digitale.'},{type:'bullets',items:['**Documenti:** individuare informazioni in un archivio.','**Database:** eseguire query controllate.','**Sviluppo software:** ispezionare un progetto o avviare test.','**BIM:** recuperare elementi e parametri da Revit.']},{type:'p',text:'Le funzionalità non sono automatiche: dipendono da ciò che **quel particolare server** ha implementato e dai permessi concessi.'}],
          en:[{type:'p',text:'MCP is not limited to BIM. Through suitable servers, an assistant may query a database, read documents, interact with developer tools, or access data from a digital model.'},{type:'bullets',items:['**Documents:** locate information in an archive.','**Databases:** run controlled queries.','**Software development:** inspect a project or run tests.','**BIM:** retrieve Revit elements and parameters.']},{type:'p',text:'These capabilities are not automatic: they depend on what **that specific server** implements and what permissions it has.'}]
        }},
        {id:'e1s5',title:{it:'Cosa ricordare',en:'What to remember'},blocks:{
          it:[{type:'p',text:'MCP è un **ponte standardizzato** fra un’applicazione che vuole usare strumenti e un programma che li rende disponibili. Non trasforma magicamente un LLM in un esperto onnisciente del progetto: apre un canale esplicito per richiedere operazioni.'},{type:'checkpoint',question:'Un MCP Server contiene necessariamente un modello AI?',options:['Sì, sempre','No, può esporre Tools e dati senza contenere un LLM'],correct:1,feedback:'Il server può essere un normale programma che esegue funzioni deterministiche.'}],
          en:[{type:'p',text:'MCP is a **standardized bridge** between an application seeking tools and a program offering them. It does not magically turn an LLM into an all-knowing expert on your project: it opens an explicit channel for requesting operations.'},{type:'checkpoint',question:'Must an MCP server contain an AI model?',options:['Yes, always','No; it can expose tools and data without an LLM'],correct:1,feedback:'A server may simply be a regular program executing deterministic functions.'}]
        }}
      ]
    },
    {
      id:'e2',mins:7,title:{it:'Come funziona MCP?',en:'How does MCP work?'},subtitle:{it:'Host, Client, Server e flusso delle richieste',en:'Host, Client, Server, and request flow'},
      goals:{it:['Identificare Host, Client e Server','Seguire una chiamata dall’utente al risultato','Comprendere l’idea di comunicazione strutturata'],en:['Identify Host, Client, and Server','Follow a call from user to result','Understand structured communication']},
      steps:[
        {id:'e2s1',title:{it:'I tre protagonisti',en:'The three main roles'},blocks:{
          it:[{type:'p',text:'Un’architettura MCP comprende un **Host**, uno o più **Client** gestiti dall’Host e uno o più **Server**. Per esempio, Claude Desktop può agire da Host; un suo client MCP può collegarsi al server locale per Revit.'},{type:'bullets',items:['**Host:** applicazione in cui lavori con l’AI e gestisci le connessioni.','**Client:** componente che dialoga con uno specifico server.','**Server:** programma che pubblica strumenti o risorse.']},{type:'p',text:'Non confondere il **Client** con l’LLM: il modello interpreta richieste, mentre il client implementa la comunicazione con il server.'}],
          en:[{type:'p',text:'An MCP architecture consists of a **Host**, one or more **Clients** managed by that host, and one or more **Servers**. For example, Claude Desktop can be the host, while one of its MCP clients connects to a local server for Revit.'},{type:'bullets',items:['**Host:** the application where you interact with AI and manage connections.','**Client:** the component communicating with a specific server.','**Server:** the program publishing tools or resources.']},{type:'p',text:'Do not confuse the **Client** with the LLM: the model interprets requests, while the client implements communication with the server.'}]
        }},
        {id:'e2s2',title:{it:'Esplora l’architettura',en:'Explore the architecture'},blocks:{
          it:[{type:'p',text:'Seleziona i componenti dello schema per visualizzarne responsabilità e confini. L’applicazione esterna (Revit) non è formalmente un quarto ruolo MCP: è il sistema che il server integra.'},{type:'interactive',widget:'architecture'},{type:'source',ids:['arch']}],
          en:[{type:'p',text:'Select components in the diagram to inspect their responsibilities and boundaries. The external application (Revit) is not a fourth MCP role: it is the system integrated by the server.'},{type:'interactive',widget:'architecture'},{type:'source',ids:['arch']}]
        }},
        {id:'e2s3',title:{it:'Dalla domanda alla risposta',en:'From question to answer'},blocks:{
          it:[{type:'p',text:'Una richiesta pratica attraversa più fasi. Prima il client scopre quali capacità sono disponibili; poi l’AI sceglie, se appropriato, uno strumento. Il client invia una richiesta al server; quest’ultimo esegue l’operazione e restituisce i dati. Infine l’AI li interpreta.'},{type:'bullets',items:['1. L’utente formula una domanda.','2. L’Host dispone della descrizione dei Tools.','3. Il modello sceglie uno strumento e propone gli argomenti.','4. Il client invia la chiamata; il server esegue.','5. Il risultato ritorna all’Host e viene presentato.']},{type:'note',title:'Distinzione importante',text:'Il server esegue l’azione; il modello AI sceglie e interpreta. Non sono lo stesso componente.'}],
          en:[{type:'p',text:'A real request passes through several stages. The client discovers available capabilities; the AI selects a suitable tool, if needed. The client sends a request to the server, which performs the action and returns data. Finally, the AI interprets that result.'},{type:'bullets',items:['1. The user asks a question.','2. The host has descriptions of available tools.','3. The model selects a tool and proposes arguments.','4. The client sends a call; the server performs it.','5. The result returns to the host and is presented.']},{type:'note',title:'Important distinction',text:'The server executes the action; the AI model selects and interprets it. They are different components.'}]
        }},
        {id:'e2s4',title:{it:'Come viaggiano i messaggi',en:'How messages travel'},blocks:{
          it:[{type:'p',text:'MCP utilizza messaggi strutturati basati su **JSON-RPC**. Per trasportarli può utilizzare, tra le altre modalità, **STDIO** per processi locali oppure **Streamable HTTP** attraverso una rete.'},{type:'p',text:'Nel caso del server ufficiale Revit, Autodesk documenta una connessione locale STDIO. Questo significa che il client comunica con un programma eseguito sul computer dell’utente, non direttamente con un server pubblico su Internet.'},{type:'note',title:'Privacy',text:'Server locale non significa necessariamente dati confinati al PC: un client con LLM cloud può inviare al proprio servizio dati restituiti dagli strumenti.'},{type:'source',ids:['mcp','autodesk']}],
          en:[{type:'p',text:'MCP uses structured messages based on **JSON-RPC**. Messages can be carried through transports such as **STDIO** for local processes or **Streamable HTTP** over a network.'},{type:'p',text:'Autodesk documents a local STDIO connection for the official Revit server. The client communicates with a program running on the user’s machine, not directly with a public Internet server.'},{type:'note',title:'Privacy',text:'A local server does not automatically mean all data stays on the PC: a cloud-based LLM client may transmit information returned by tools to its service.'},{type:'source',ids:['mcp','autodesk']}]
        }},
        {id:'e2s5',title:{it:'Riconosci i ruoli',en:'Identify the roles'},blocks:{
          it:[{type:'p',text:'Verifichiamo l’architettura con una domanda semplice. Considera che l’utente sta usando Claude Desktop per interrogare un modello RVT.'},{type:'checkpoint',question:'Quale componente espone le funzioni che permettono di leggere i dati del modello?',options:['MCP Server','LLM','Il testo del prompt'],correct:0,feedback:'È il server MCP a pubblicare strumenti; l’integrazione sottostante interagisce con Revit.'},{type:'p',text:'Nel prossimo modulo vedremo **che cosa** il server può esporre: Tools, Resources e Prompts.'}],
          en:[{type:'p',text:'Let us test the architecture with one question. Imagine a user asking Claude Desktop to inspect an RVT model.'},{type:'checkpoint',question:'Which component exposes the operations for reading model data?',options:['MCP server','LLM','The prompt text'],correct:0,feedback:'The MCP server publishes tools; the underlying integration communicates with Revit.'},{type:'p',text:'Next, we will explore **what** a server can publish: Tools, Resources, and Prompts.'}]
        }}
      ]
    },
    {
      id:'e3',mins:5,title:{it:'Tools, Resources e Prompts',en:'Tools, Resources, and Prompts'},subtitle:{it:'Le tre funzionalità fondamentali esposte dai server',en:'Three core capabilities servers can expose'},
      goals:{it:['Distinguere Tools, Resources e Prompts','Riconoscere esempi concreti','Capire che non tutti i server offrono tutto'],en:['Distinguish tools, resources, and prompts','Recognize real examples','Understand that not all servers offer everything']},
      steps:[
        {id:'e3s1',title:{it:'Tools: eseguire operazioni',en:'Tools: perform operations'},blocks:{
          it:[{type:'p',text:'Un **Tool** è una funzione esposta dal server e richiamabile da un client. Ha un nome, una descrizione e uno schema degli argomenti. Può leggere dati, eseguire calcoli o — se progettato per farlo e autorizzato — modificare informazioni.'},{type:'p',text:'Esempio concettuale: un Tool `count_elements(category)` potrebbe restituire il numero di elementi di una categoria BIM. Il nome è **inventato per la lezione** e non identifica uno specifico Tool Autodesk.'},{type:'note',title:'Non basta chiedere',text:'Un prompt non può aggiungere magicamente un Tool che il server non implementa.'},{type:'source',ids:['tools']}],
          en:[{type:'p',text:'A **Tool** is a server function callable by a client. It has a name, a description, and an argument schema. It may read data, compute results or — if implemented and authorized — modify information.'},{type:'p',text:'Conceptual example: `count_elements(category)` could return the number of BIM elements in a category. This name is **invented for teaching**; it is not a named Autodesk tool.'},{type:'note',title:'A prompt is not enough',text:'A prompt cannot magically add a tool that the server has not implemented.'},{type:'source',ids:['tools']}]
        }},
        {id:'e3s2',title:{it:'Resources: consultare contenuti',en:'Resources: read content'},blocks:{
          it:[{type:'p',text:'Una **Resource** rappresenta un contenuto che il server rende consultabile tramite un identificatore URI. Può essere una descrizione, un file, un documento o un’altra informazione resa disponibile in modo strutturato.'},{type:'p',text:'Per esempio, un server costruito su misura potrebbe esporre `bim://project/summary` per fornire un riepilogo del progetto. Anche questo URI è **dimostrativo**.'},{type:'p',text:'Il punto centrale è la differenza tra **richiamare un’operazione** (Tool) e **consultare un contenuto identificato** (Resource).'}],
          en:[{type:'p',text:'A **Resource** represents content a server makes readable through a URI identifier. This could be a description, file, document, or other structured information.'},{type:'p',text:'For example, a custom-built server might expose `bim://project/summary` as a project summary. This URI is also **illustrative**.'},{type:'p',text:'The key distinction is between **calling an operation** (Tool) and **reading identified content** (Resource).'}]
        }},
        {id:'e3s3',title:{it:'Prompts: istruzioni riutilizzabili',en:'Prompts: reusable instructions'},blocks:{
          it:[{type:'p',text:'Un **Prompt** MCP è un modello di messaggio riutilizzabile che il server può pubblicare. Può aiutare a guidare una specifica attività, eventualmente accettando argomenti.'},{type:'p',text:'Per esempio, un server didattico potrebbe offrire il prompt “Analizza la completezza informativa del progetto” come schema per impostare un’attività di controllo. Questa possibilità dipende dall’implementazione del server.'},{type:'note',title:'Ricorda',text:'Tools, Resources e Prompts sono categorie previste dal protocollo, ma un server concreto può implementarne soltanto alcune.'}],
          en:[{type:'p',text:'An MCP **Prompt** is a reusable message template that a server can publish. It can guide a specific activity and may accept parameters.'},{type:'p',text:'For instance, a teaching server could offer “Review the project’s information completeness” as a template for a checking task. Whether this exists depends on that server’s implementation.'},{type:'note',title:'Remember',text:'Tools, Resources, and Prompts are protocol capabilities, but a real server may implement only some of them.'}]
        }},
        {id:'e3s4',title:{it:'Riconosci la funzionalità',en:'Match the capability'},blocks:{
          it:[{type:'p',text:'Per ciascun esempio, seleziona se rappresenta un Tool, una Resource o un Prompt. Riceverai subito un feedback motivato.'},{type:'interactive',widget:'primitives'}],
          en:[{type:'p',text:'For each scenario, choose whether it represents a Tool, Resource, or Prompt. You will receive explanatory feedback immediately.'},{type:'interactive',widget:'primitives'}]
        }},
        {id:'e3s5',title:{it:'Capacità e autorizzazioni',en:'Capabilities and permissions'},blocks:{
          it:[{type:'p',text:'Scoprire un Tool non significa avere il permesso di utilizzarlo indiscriminatamente. La disponibilità dipende da configurazione, autorizzazioni e regole del sistema ospitante. È particolarmente importante distinguere operazioni **read-only** da operazioni di **scrittura**.'},{type:'p',text:'Quando si lavora su documenti o modelli reali è buona pratica iniziare dalla lettura, ispezionare i risultati e confermare consapevolmente eventuali modifiche.'}],
          en:[{type:'p',text:'Discovering a Tool does not mean it can be used without restrictions. Availability depends on configuration, permissions, and rules enforced by the host environment. Distinguishing **read-only** actions from **write** actions is particularly important.'},{type:'p',text:'With real documents or models, a good practice is to start with reading, inspect outputs, and consciously authorize any changes.'}]
        }}
      ]
    },
    {
      id:'e4',mins:8,title:{it:'MCP applicato a Revit',en:'MCP applied to Revit'},subtitle:{it:'Dal linguaggio naturale ai dati del modello BIM',en:'From natural language to BIM model data'},
      goals:{it:['Spiegare il collegamento MCP–Revit API','Conoscere le capacità principali e i prerequisiti','Seguire una simulazione realistica senza modificare file'],en:['Explain the MCP–Revit API connection','Know main capabilities and prerequisites','Follow a realistic simulation without modifying files']},
      steps:[
        {id:'e4s1',title:{it:'Revit, API e MCP',en:'Revit, API, and MCP'},blocks:{
          it:[{type:'p',text:'Revit contiene oggetti BIM, geometrie e informazioni. La **Revit API** permette a software e add-in di interagire programmaticamente con tali dati. Un server MCP rende disponibili **alcune operazioni implementate** a un client AI, tramite il protocollo MCP.'},{type:'p',text:'Non bisogna pensare a MCP come a una nuova Revit API: è un **livello di collegamento** fra l’applicazione AI e strumenti che interagiscono con Revit.'},{type:'note',title:'Caso reale',text:'I server MCP ufficiali Autodesk sono disponibili in Technical Preview. Questa Academy utilizza Revit 2027.3, la cui compatibilità è stata confermata dall’autore. Le funzioni dipendono dal server installato.'},{type:'source',ids:['autodesk']}],
          en:[{type:'p',text:'Revit contains BIM objects, geometry, and information. The **Revit API** lets software and add-ins interact programmatically with this data. An MCP server makes **certain implemented operations** accessible to an AI client through MCP.'},{type:'p',text:'MCP should not be regarded as a new Revit API: it is a **connection layer** between an AI application and tools integrated with Revit.'},{type:'note',title:'Real-world example',text:'Autodesk provides official MCP servers in Technical Preview. This Academy uses Revit 2027.3, with compatibility confirmed by the course author. Capabilities depend on the installed server.'},{type:'source',ids:['autodesk']}]
        }},
        {id:'e4s2',title:{it:'Di cosa ho bisogno?',en:'What do I need?'},blocks:{
          it:[{type:'p',text:'Per una connessione operativa con il server ufficiale Autodesk servono **Revit 2027.3**, il relativo add-on MCP e un client AI che supporti server MCP locali, per esempio Claude Desktop, configurato correttamente.'},{type:'bullets',items:['1. Revit 2027.3 con un progetto aperto.','2. Revit MCP Server add-on appropriato.','3. Client AI compatibile con MCP locale.','4. Configurazione della connessione al server e verifica.']},{type:'p',text:'Questa lezione **non richiede** di installare nessuno di questi software. La procedura guidata completa è disponibile nel percorso Advanced. Funzionalità e limiti dei client gratuiti possono cambiare nel tempo.'},{type:'source',ids:['setup','autodesk']}],
          en:[{type:'p',text:'To connect through Autodesk’s official server, you need **Revit 2027.3**, the corresponding MCP add-on, and an AI client supporting local MCP servers, such as Claude Desktop, configured correctly.'},{type:'bullets',items:['1. Revit 2027.3 with a project open.','2. The relevant Revit MCP Server add-on.','3. An AI client supporting local MCP.','4. Server connection configuration and verification.']},{type:'p',text:'This lesson **does not require** installing any of these applications. The full hands-on procedure is available in the Advanced track. Free-tier client capabilities and limits may change.'},{type:'source',ids:['setup','autodesk']}]
        }},
        {id:'e4s3',title:{it:'Leggere o modificare?',en:'Read or write?'},blocks:{
          it:[{type:'p',text:'Autodesk distingue tre configurazioni nella Technical Preview: **Read** (interrogazioni senza modifica), **Write** (aggiunge modifiche controllate) ed **Experimental** (aggiunge strumenti sperimentali). Le loro capacità sono cumulative, ma non ogni possibile operazione della Revit API è necessariamente disponibile.'},{type:'bullets',items:['**Read:** cercare elementi, leggere parametri, produrre riepiloghi, navigare nelle viste con i Tools supportati.','**Write:** eseguire modifiche supportate, preferibilmente su copie di lavoro e dopo verifica.','**Experimental:** provare funzionalità meno consolidate, con cautela aggiuntiva.']},{type:'note',title:'Scelta didattica',text:'Nel nostro esempio useremo soltanto una richiesta di lettura, che non modifica il modello.'},{type:'source',ids:['autodesk']}],
          en:[{type:'p',text:'Autodesk distinguishes three Technical Preview options: **Read** (non-mutating queries), **Write** (adds controlled modifications), and **Experimental** (adds experimental tools). Their capabilities are cumulative, but not every operation possible through the Revit API is necessarily available.'},{type:'bullets',items:['**Read:** find elements, inspect parameters, build reports, navigate views using supported tools.','**Write:** perform supported changes, preferably on working copies after review.','**Experimental:** test less mature features with additional caution.']},{type:'note',title:'Teaching choice',text:'Our example uses a read-only request and does not change the model.'},{type:'source',ids:['autodesk']}]
        }},
        {id:'e4s4',title:{it:'Simula una richiesta a Revit',en:'Simulate a Revit request'},blocks:{
          it:[{type:'p',text:'Prova a seguire la richiesta: **«Conta le pareti del modello Revit aperto»**. Il simulatore mostrerà quale componente interviene in ogni fase, quale dato viene scambiato e quando l’AI interpreta il risultato.'},{type:'interactive',widget:'revit'},{type:'warning',title:'Simulazione, non connessione reale',text:'Il numero di elementi e il nome del Tool sono fittizi. Il sito non comunica con Revit e non può verificare il tuo modello.'}],
          en:[{type:'p',text:'Follow this request: **“Count the walls in the open Revit model.”** The simulator shows which component acts at each stage, what information is exchanged, and when the AI interprets the result.'},{type:'interactive',widget:'revit'},{type:'warning',title:'Simulation, not a live connection',text:'The element count and tool name are invented. This website does not communicate with Revit and cannot inspect your model.'}]
        }},
        {id:'e4s5',title:{it:'Possibilità e limiti',en:'Possibilities and limits'},blocks:{
          it:[{type:'p',text:'Un MCP per Revit può diventare utile per interrogazioni guidate, analisi di parametri, report e operazioni supportate di editing. Però la qualità della risposta dipende da **dati del modello**, **Tools disponibili**, **argomenti richiesti** e **interpretazione dell’AI**.'},{type:'p',text:'Nel BIM una verifica è essenziale: un risultato apparentemente plausibile non prova che il dato provenga dal modello giusto, dalla categoria corretta o dal parametro previsto.'},{type:'checkpoint',question:'Qual è la scelta più prudente per una prima prova su Revit?',options:['Eseguire una modifica massiva su un progetto reale','Interrogare elementi in modalità Read e verificare il risultato'],correct:1,feedback:'Le richieste read-only permettono di verificare connessione e dati senza alterare il modello.'}],
          en:[{type:'p',text:'MCP for Revit can support guided queries, parameter analysis, reports, and supported editing operations. However, output quality depends on **model data**, **available tools**, **call arguments**, and **AI interpretation**.'},{type:'p',text:'Verification matters in BIM: a plausible response does not prove that data came from the correct model, category, or parameter.'},{type:'checkpoint',question:'What is the safest way to start testing MCP with Revit?',options:['Make bulk edits to a live project','Query elements using Read tools and verify the results'],correct:1,feedback:'Read-only calls let you verify connectivity and data without altering the model.'}]
        }}
      ]
    },
    {
      id:'e5',mins:5,title:{it:'Verifica e prossimi passi',en:'Review and next steps'},subtitle:{it:'Consolida le conoscenze in 10 domande',en:'Consolidate your knowledge with 10 questions'},
      goals:{it:['Riconoscere i concetti principali','Verificare la comprensione con soglia 80%','Sapere dove proseguire'],en:['Recognize key concepts','Test understanding with an 80% passing threshold','Know where to go next']},
      steps:[
        {id:'e5s1',title:{it:'La mappa concettuale',en:'The concept map'},blocks:{
          it:[{type:'p',text:'Hai visto il quadro generale: l’**Host** ospita l’esperienza AI, il **Client** parla con il **Server**, il Server espone Tools/Resources/Prompts e può integrare applicazioni come **Revit**. Il protocollo standardizza le comunicazioni, ma non sostituisce le API.'},{type:'bullets',items:['**MCP:** linguaggio comune per le integrazioni.','**Tool:** operazione disponibile, con argomenti definiti.','**Revit:** dati e operazioni reali, accessibili soltanto attraverso strumenti implementati.','**Verifica:** l’output AI va controllato rispetto alla fonte.']},{type:'note',title:'Obiettivo della prova',text:'Dimostrare la comprensione dei concetti, non memorizzare dettagli di codice.'}],
          en:[{type:'p',text:'You now have the big picture: the **Host** runs the AI experience, the **Client** talks to the **Server**, the server exposes Tools/Resources/Prompts, and may integrate applications like **Revit**. MCP standardizes communication but does not replace APIs.'},{type:'bullets',items:['**MCP:** a shared protocol for integrations.','**Tool:** an available operation with defined arguments.','**Revit:** real data and operations, accessible only via implemented tools.','**Verification:** AI outputs should be checked against the source.']},{type:'note',title:'Assessment goal',text:'Show conceptual understanding, not memorize code details.'}]
        }},
        {id:'e5s2',title:{it:'Quiz finale: 10 domande',en:'Final quiz: 10 questions'},blocks:{
          it:[{type:'p',text:'Rispondi alle 10 domande. Serve almeno l’**80%** per superare la verifica. Puoi ripeterla senza limiti: ogni risposta sarà accompagnata da una spiegazione. Il punteggio migliore resta salvato in questo browser.'},{type:'interactive',widget:'quiz'}],
          en:[{type:'p',text:'Answer 10 questions. You need at least **80%** to pass. You can retry without limits; each answer comes with an explanation. Your best score is saved in this browser.'},{type:'interactive',widget:'quiz'}]
        }},
        {id:'e5s3',title:{it:'Cosa hai imparato',en:'What you have learned'},blocks:{
          it:[{type:'p',text:'Se ora sai spiegare **perché MCP esiste**, distinguere Host/Client/Server, riconoscere Tools/Resources/Prompts e seguire il flusso di una richiesta Revit, hai raggiunto l’obiettivo di Essentials.'},{type:'p',text:'Il percorso **Advanced** è ora disponibile come corso distinto di MCP Academy. Include configurazione reale, laboratori sul modello Revit 2027 e sviluppo di un MCP personalizzato. Per il momento non sono necessarie installazioni.'},{type:'note',title:'Per continuare autonomamente',text:'Puoi riaprire qualsiasi passaggio, consultare il glossario o seguire i riferimenti ufficiali indicati nelle lezioni.'}],
          en:[{type:'p',text:'If you can now explain **why MCP exists**, distinguish Host/Client/Server, recognize Tools/Resources/Prompts, and follow a Revit request, you have reached the Essentials learning goal.'},{type:'p',text:'The **Advanced** track is now available as a separate course. It includes real setup, Revit 2027 model labs, and custom MCP development. No installation is needed at this stage.'},{type:'note',title:'Continue learning',text:'You can revisit any step, consult the glossary, or follow the official references attached to lessons.'}]
        }}
      ]
    }
  ],
  quiz:[
    {q:{it:'Che cosa rappresenta MCP?',en:'What does MCP stand for?'},a:{it:['Un modello AI specializzato','Uno standard per collegare applicazioni e strumenti','Un nuovo formato di file BIM'],en:['A specialized AI model','A standard for connecting applications and tools','A new BIM file format']},correct:1,why:{it:'MCP è un protocollo aperto di integrazione; non è un LLM né un formato RVT/IFC.',en:'MCP is an open integration protocol, not an LLM or an RVT/IFC file format.'}},
    {q:{it:'Un assistente senza accesso al tuo modello può sapere il numero reale di pareti?',en:'Can an assistant without access to your model know its actual wall count?'},a:{it:['No, può soltanto ipotizzare o spiegare come ottenerlo','Sì, perché conosce già Revit','Sì, leggendo automaticamente il PC'],en:['No; it can only guess or explain how to obtain it','Yes, because it knows Revit','Yes, by automatically reading the PC']},correct:0,why:{it:'Senza strumenti o dati forniti, non può leggere autonomamente il progetto.',en:'Without tools or supplied data, it cannot inspect the project.'}},
    {q:{it:'Quale ruolo svolge un MCP Server?',en:'What does an MCP server do?'},a:{it:['Ospita obbligatoriamente il modello AI','Espone strumenti e dati tramite MCP','Sostituisce tutte le API esterne'],en:['Always hosts the AI model','Exposes tools and data through MCP','Replaces all external APIs']},correct:1,why:{it:'Un server pubblica capacità implementate; normalmente si integra con API esistenti.',en:'A server publishes implemented capabilities and often integrates existing APIs.'}},
    {q:{it:'Che differenza c’è fra MCP Host e MCP Client?',en:'How do MCP Host and MCP Client differ?'},a:{it:['Sono sempre sinonimi','L’Host gestisce l’esperienza AI; il Client comunica con un server','Il Client è sempre il modello LLM'],en:['They are always synonymous','The host manages the AI experience; the client talks to a server','The client is always the LLM']},correct:1,why:{it:'L’Host contiene/gestisce i client per le diverse connessioni.',en:'The host manages clients for different server connections.'}},
    {q:{it:'Qual è un esempio di MCP Tool?',en:'Which is an example of an MCP tool?'},a:{it:['Una funzione che legge elementi del modello','La definizione di un termine nel glossario','Un testo introduttivo statico'],en:['A function that reads model elements','A glossary definition','A static introduction paragraph']},correct:0,why:{it:'Il Tool è un’operazione richiamabile con nome e argomenti.',en:'A tool is a callable operation with a name and arguments.'}},
    {q:{it:'Quale elemento descrive meglio una Resource?',en:'Which best describes a Resource?'},a:{it:['Un contenuto consultabile identificato da URI','Un comando per modificare una parete','Il modello linguistico'],en:['Readable content identified by a URI','A command to modify a wall','The language model']},correct:0,why:{it:'Una Resource rende accessibili contenuti, non è necessariamente un’operazione.',en:'A resource makes content readable; it is not necessarily an operation.'}},
    {q:{it:'Cosa rappresenta un MCP Prompt?',en:'What is an MCP Prompt?'},a:{it:['Un modello di istruzioni riutilizzabile','Un server HTTP','Un file RVT'],en:['A reusable instruction template','An HTTP server','An RVT file']},correct:0,why:{it:'I prompt MCP sono modelli di messaggi che un server può esporre.',en:'MCP prompts are message templates a server can expose.'}},
    {q:{it:'Quale relazione è corretta tra MCP e Revit API?',en:'Which statement about MCP and the Revit API is correct?'},a:{it:['MCP sostituisce completamente la Revit API','MCP può esporre funzioni implementate tramite la Revit API','MCP converte automaticamente un RVT in IFC'],en:['MCP completely replaces the Revit API','MCP can expose functions implemented using the Revit API','MCP automatically converts an RVT to IFC']},correct:1,why:{it:'Il server collega l’applicazione AI a operazioni software; l’API continua a fare il lavoro su Revit.',en:'The server links AI applications to software actions; the API still performs Revit operations.'}},
    {q:{it:'Quale versione di Revit utilizza questa Academy per gli esercizi MCP?',en:'Which Revit version is used for MCP exercises in this Academy?'},a:{it:['Revit 2024 senza aggiornamenti','Revit 2027.3','Qualsiasi versione di Revit'],en:['Revit 2024 without updates','Revit 2027.3','Any Revit version']},correct:1,why:{it:'Il corso è progettato per Revit 2027.3, la cui compatibilità è stata confermata dall’autore.',en:'The course targets Revit 2027.3, with compatibility confirmed by the course author.'}},
    {q:{it:'Qual è il comportamento più corretto dopo una risposta MCP su dati BIM?',en:'What should you do after an MCP-generated response about BIM data?'},a:{it:['Accettarla sempre come corretta','Verificarne fonte, oggetti e valori','Assumere che ogni Tool possa modificare il progetto'],en:['Always accept it as correct','Verify the source, objects, and values','Assume every tool can modify the project']},correct:1,why:{it:'Il modello AI può scegliere strumenti o interpretare dati in modo scorretto: i risultati vanno verificati.',en:'AI models can select inappropriate tools or misinterpret data: verify outputs.'}}
  ]
};


window.MCP_ADVANCED_DATA = {"version":"2.0.0","updated":"2026-10-14","author":"Ygor Fasanella","modules":[{"id":"m1","title":{"it":"Fondamenti MCP","en":"MCP foundations"},"subtitle":{"it":"Principi, benefici e limiti del protocollo","en":"Purpose, value and limits of the protocol"},"mins":30,"lessons":[{"id":"a1.1","title":{"it":"Perché nasce MCP","en":"Why MCP exists"},"mins":10,"kind":"flow","steps":[{"title":{"it":"Il concetto","en":"The concept"},"text":{"it":"Un modello linguistico può redigere istruzioni o codice, ma non accede automaticamente ai documenti e alle applicazioni presenti su un computer. MCP nasce per normalizzare l’interazione tra applicazioni AI e strumenti esterni. Il protocollo non crea permessi e non aggiunge capacità che il server non abbia implementato.","en":"A language model can draft instructions or code, but it does not automatically access documents and applications on your computer. MCP standardises interaction between AI applications and external tools. The protocol does not grant permissions or invent capabilities absent from the server."}},{"title":{"it":"Come funziona","en":"How it works"},"text":{"it":"L’applicazione host mantiene la conversazione. Uno o più client MCP dialogano con altrettanti server; ciascun server dichiara le funzioni che può esporre. Il modello può decidere quale funzione chiedere di usare, mentre l’host governa l’esecuzione e le eventuali autorizzazioni.","en":"The host application owns the conversation. One or more MCP clients connect to servers, each declaring the functionality it offers. The model may choose which tool to request, while the host controls execution and any permissions."}},{"title":{"it":"Caso applicativo","en":"Applied example"},"text":{"it":"In un flusso BIM, chiedere «quante porte sono presenti?» a un chatbot non connesso a Revit produce soltanto una procedura ipotetica. Con un server MCP opportuno, lo stesso chatbot può chiedere dati reali e presentare una risposta verificabile.","en":"In a BIM workflow, asking an unconnected chatbot “how many doors are there?” produces only hypothetical instructions. With an appropriate MCP server, the same chatbot can request actual model data and present a verifiable answer."},"widget":"flow"},{"title":{"it":"Esercitazione e verifica","en":"Practice and verify"},"text":{"it":"Formula due esempi: uno in cui basta una risposta testuale e uno in cui servono dati correnti da un programma. Identifica quali informazioni non sono già incluse nel prompt.\n\n**Controllo:** Secondo esempio: serve un server collegato all’applicazione e il relativo Tool, non soltanto un modello AI più avanzato.","en":"Write two requests: one answerable as text alone and another requiring live application data. Identify what information is missing from the prompt itself.\n\n**Check:** Second example: you need a server connected to the application and a relevant tool, not merely a more powerful language model."}}]},{"id":"a1.2","title":{"it":"MCP e API: due livelli distinti","en":"MCP versus APIs: different layers"},"mins":10,"kind":"flow","steps":[{"title":{"it":"Il concetto","en":"The concept"},"text":{"it":"Le API espongono funzionalità di un programma a un altro programma. MCP definisce invece un linguaggio standard perché un’applicazione AI possa scoprire e richiamare funzionalità offerte da server. Le due tecnologie operano a livelli diversi e spesso vengono impiegate insieme.","en":"APIs expose an application’s capabilities to other software. MCP defines a common language for an AI application to discover and request functionality exposed by servers. They operate at different layers and are often combined."}},{"title":{"it":"Come funziona","en":"How it works"},"text":{"it":"Un add-in C# può usare la Revit API per recuperare elementi. Un server MCP può esporre quell’operazione come Tool con nome, descrizione e schema degli argomenti. Il client chiama il Tool; è il codice dell’add-in, non MCP, che interroga davvero Revit.","en":"A C# add-in can use the Revit API to retrieve elements. An MCP server can expose that operation as a named tool with a description and argument schema. The client calls the tool; the add-in code—not MCP itself—actually queries Revit."}},{"title":{"it":"Caso applicativo","en":"Applied example"},"text":{"it":"Confronta `FilteredElementCollector` della Revit API con un ipotetico Tool `get_elements(category=\"Walls\")`: il secondo è un’interfaccia semplificata definita dal server, non un metodo standard di Revit.","en":"Compare Revit API `FilteredElementCollector` with a hypothetical tool `get_elements(category=\"Walls\")`: the latter is a simplified interface defined by the server, not a built-in Revit method."},"widget":"flow"},{"title":{"it":"Esercitazione e verifica","en":"Practice and verify"},"text":{"it":"Indica chi definisce la forma del Tool e chi esegue la selezione effettiva degli elementi.\n\n**Controllo:** Il server definisce il Tool, mentre l’implementazione usa API o altra logica per operare sui dati.","en":"Identify who defines the tool interface and who actually selects the elements.\n\n**Check:** The server defines the tool, while its implementation uses APIs or other logic to work on the data."}}]},{"id":"a1.3","title":{"it":"Ecosistema e casi d’uso","en":"Ecosystem and use cases"},"mins":10,"kind":"theory","steps":[{"title":{"it":"Il concetto","en":"The concept"},"text":{"it":"Un host può collegarsi a molti server MCP diversi: file, database, repository di codice, applicazioni di produttività o ambienti BIM. L’interoperabilità riguarda l’interfaccia di comunicazione e non implica automaticamente interoperabilità semantica tra tutti i dati.","en":"One host may connect to many MCP servers for files, databases, code repositories, productivity apps, or BIM environments. Interoperability applies to the communication interface and does not automatically mean semantic interoperability of all exchanged data."}},{"title":{"it":"Come funziona","en":"How it works"},"text":{"it":"I Tool sono eseguiti attraverso connessioni configurate: processi locali via STDIO o server raggiungibili via HTTP. Una soluzione locale può comunque inviare risultati a un LLM cloud se l’host è configurato per farlo: trattamento dei dati e permessi vanno esaminati separatamente.","en":"Tools are invoked over configured connections: local STDIO processes or HTTP services. A local server can still pass results to a cloud LLM if the host works that way; permissions and data handling must be assessed separately."}},{"title":{"it":"Caso applicativo","en":"Applied example"},"text":{"it":"Un assistente collegato a Revit e a un database può ricavare una lista di elementi BIM e confrontarla con un elenco di requisiti. La qualità del confronto dipenderà dalle definizioni e dalla mappatura informativa sviluppate, non solo da MCP.","en":"An assistant connected to Revit and a database can retrieve BIM elements and compare them against requirements. The quality of that comparison depends on the definitions and information mapping implemented, not simply on MCP."}},{"title":{"it":"Esercitazione e verifica","en":"Practice and verify"},"text":{"it":"Disegna un diagramma con un host e tre server. Per ciascun server indica una funzione plausibile e un potenziale limite.\n\n**Controllo:** Distingui sempre «server connesso» da «Tool realmente disponibile e autorizzato».","en":"Sketch one host connecting to three servers. Identify one plausible capability and one limitation of each server.\n\n**Check:** Always distinguish “server connected” from “tool actually available and permitted”."}}]}],"quiz":[{"q":{"it":"Che cosa standardizza MCP?","en":"What does MCP standardise?"},"opts":{"it":["La comunicazione tra host AI e server","Tutte le geometrie Revit","Il linguaggio di programmazione C#"],"en":["Communication between AI hosts and servers","All Revit geometry","The C# programming language"]},"correct":0,"why":{"it":"MCP specifica un’interfaccia comune, non una struttura geometrica BIM.","en":"MCP specifies a common interface, not a BIM geometry structure."}},{"q":{"it":"Una API e MCP...","en":"An API and MCP..."},"opts":{"it":["sono sempre equivalenti","possono essere usati insieme","richiedono entrambi un LLM"],"en":["are always equivalent","can be used together","both require an LLM"]},"correct":1,"why":{"it":"La API esegue operazioni; MCP può esporle come strumenti.","en":"An API performs operations; MCP can expose them as tools."}},{"q":{"it":"Un LLM senza strumenti connessi può contare le pareti aperte in Revit?","en":"Can an LLM without connected tools count walls in an open Revit model?"},"opts":{"it":["Sì, sempre","Solo se indovina","No, non accede automaticamente al modello"],"en":["Yes, always","Only by guessing","No, it does not automatically access the model"]},"correct":2,"why":{"it":"Servono dati forniti dall’utente o un’integrazione autorizzata.","en":"It needs user-provided data or an authorised integration."}},{"q":{"it":"Un server MCP locale garantisce che i dati non raggiungano mai il cloud?","en":"Does a local MCP server guarantee data never leaves for the cloud?"},"opts":{"it":["No, dipende anche dal client AI","Sì, per definizione","Soltanto per i file IFC"],"en":["No, it also depends on the AI client","Yes, by definition","Only for IFC files"]},"correct":0,"why":{"it":"L’host AI potrebbe trasmettere i risultati a un servizio remoto.","en":"The AI host may forward the results to a remote service."}},{"q":{"it":"Se un server non espone un Tool di modifica...","en":"If a server exposes no write tool..."},"opts":{"it":["basta un prompt più forte","non si modifica il modello tramite quel Tool","MCP lo crea automaticamente"],"en":["a stronger prompt is enough","that tool cannot modify the model","MCP creates it automatically"]},"correct":1,"why":{"it":"Un prompt non aggiunge funzioni inesistenti.","en":"A prompt cannot create missing functionality."}}]},{"id":"m2","title":{"it":"Architettura MCP","en":"MCP architecture"},"subtitle":{"it":"Componenti, lifecycle, flussi e trasporti","en":"Components, lifecycle, message flows, transports"},"mins":45,"lessons":[{"id":"a2.1","title":{"it":"Host, Client e Server","en":"Host, Client and Server"},"mins":15,"kind":"flow","steps":[{"title":{"it":"Il concetto","en":"The concept"},"text":{"it":"L’Host è l’ambiente che coordina la sessione AI. Un Client MCP è il componente dell’host che instaura una connessione verso uno specifico server. Il Server MCP espone capacità e risponde alle richieste. Il modello linguistico non coincide con nessuna di queste primitive, pur contribuendo alla selezione delle operazioni.","en":"The host coordinates the AI session. An MCP client is the part of a host that establishes a connection with a particular server. The MCP server exposes capabilities and handles requests. The language model is not identical to any of these protocol roles, although it may select operations."}},{"title":{"it":"Come funziona","en":"How it works"},"text":{"it":"Un host può creare una connessione distinta per server. Durante l’avvio e la discovery, i partecipanti apprendono capacità compatibili. I controlli dell’host stabiliscono se un tool sia disponibile al modello e se richieda approvazione da parte dell’utente.","en":"A host can create a separate connection for each server. During startup and discovery, the peers learn about compatible capabilities. Host policies decide which tools are available to the model and whether a user must approve their execution."}},{"title":{"it":"Caso applicativo","en":"Applied example"},"text":{"it":"Immagina Claude Desktop come host, il client MCP integrato al suo interno e l’eseguibile Autodesk RevitMcpServer come server locale. Revit è il software esterno cui il server si collega.","en":"Imagine Claude Desktop as host, an MCP client within it, and Autodesk RevitMcpServer as a local server process. Revit is the external application accessed by that server."},"widget":"flow"},{"title":{"it":"Esercitazione e verifica","en":"Practice and verify"},"text":{"it":"Nel diagramma interattivo seleziona ciascun componente e indica chi possiede l’interfaccia utente, chi comunica e chi esegue le funzioni.\n\n**Controllo:** La Revit API resta nell’area dell’applicazione esterna: non è una primitiva MCP.","en":"In the interactive diagram, select each component and identify who owns the interface, who communicates, and who executes functions.\n\n**Check:** The Revit API remains at the external application layer: it is not an MCP primitive."}}]},{"id":"a2.2","title":{"it":"Lifecycle e chiamate","en":"Lifecycle and tool calls"},"mins":15,"kind":"flow","steps":[{"title":{"it":"Il concetto","en":"The concept"},"text":{"it":"Una sessione MCP non consiste in una semplice frase inviata a un programma. Il client deve poter stabilire una comunicazione valida, negoziare la versione/capacità secondo la revisione del protocollo usata, scoprire le funzioni esposte e infine richiamare i Tools necessari. Le implementazioni variano fra revisioni MCP.","en":"An MCP session is more than a sentence sent to a program. The client must establish valid communication, agree on compatible protocol version/capabilities as defined by the revision in use, discover exposed functions, and then invoke the required tools. Details vary across protocol revisions."}},{"title":{"it":"Come funziona","en":"How it works"},"text":{"it":"La chiamata di un Tool trasporta nome e argomenti. Il server valida l’input, esegue la propria logica e restituisce contenuti strutturati o un errore. Le richieste hanno identificativi che permettono di associare la risposta alla chiamata.","en":"A tool invocation carries a name and arguments. The server validates input, executes its logic, and returns structured content or an error. Requests have identifiers so responses can be associated with their calls."},"code":"{\"jsonrpc\":\"2.0\",\"id\":7,\"method\":\"tools/call\",\"params\":{\"name\":\"demo_count_by_category\",\"arguments\":{\"category\":\"IfcWall\"}}}"},{"title":{"it":"Caso applicativo","en":"Applied example"},"text":{"it":"Un flusso dimostrativo per una interrogazione di pareti: prompt → selezione di Tool disponibile → `tools/call` → accesso al documento → dati degli elementi → sintesi AI. I nomi dei Tools mostrati sono didattici e non attribuiti ad Autodesk.","en":"An illustrative wall query flows as: prompt → selecting an available tool → `tools/call` → document access → element data → AI summary. Tool names shown are educational examples, not claims about Autodesk tool names."},"widget":"flow"},{"title":{"it":"Esercitazione e verifica","en":"Practice and verify"},"text":{"it":"Apri il simulatore, passa dalla fase di discovery a una Tool call e annota in quale fase può comparire una richiesta di permesso.\n\n**Controllo:** La conferma dell’utente è gestita dall’host, non è una proprietà che garantisce da sola la correttezza del Tool.","en":"Use the simulator to move from discovery to a tool call and note where a permission request may arise.\n\n**Check:** User confirmation belongs to the host and does not in itself guarantee correct tool behaviour."}}]},{"id":"a2.3","title":{"it":"STDIO, HTTP e sicurezza","en":"STDIO, HTTP and security"},"mins":15,"kind":"theory","steps":[{"title":{"it":"Il concetto","en":"The concept"},"text":{"it":"STDIO è adatto a server locali avviati dal client AI come sottoprocesso. Streamable HTTP trasporta MCP mediante endpoint HTTP e viene utilizzato per servizi di rete. Il trasporto non decide da solo dove vengono elaborate le conversazioni o dove finiscono i dati estratti.","en":"STDIO suits local servers launched as subprocesses by an AI client. Streamable HTTP transports MCP through HTTP endpoints and suits network services. Transport choice alone does not determine where conversations are processed or where extracted data ends up."}},{"title":{"it":"Come funziona","en":"How it works"},"text":{"it":"Nella comunicazione STDIO, stdout è riservato ai messaggi del protocollo: stampare log di debug su stdout può rompere il parsing. Usa stderr o gli strumenti di logging supportati. Con HTTP considera autenticazione, rete, TLS, controllo degli accessi e esposizione degli endpoint.","en":"With STDIO, stdout carries protocol messages: printing debug logs to stdout can corrupt parsing. Use stderr or supported logging facilities. With HTTP, consider authentication, networking, TLS, access control, and endpoint exposure."}},{"title":{"it":"Caso applicativo","en":"Applied example"},"text":{"it":"Il server ufficiale Revit è locale e comunica tramite STDIO. Un server personalizzato per una dashboard web potrebbe invece esporre un endpoint HTTP su una porta locale o remota, opportunamente protetta.","en":"Autodesk’s official Revit server is local and communicates over STDIO. A custom server for a web dashboard might instead expose an HTTP endpoint on a properly secured local or remote port."}},{"title":{"it":"Esercitazione e verifica","en":"Practice and verify"},"text":{"it":"Classifica tre scenari — uso sullo stesso PC, server condiviso in rete, lettura di dati sensibili — individuando trasporto e controlli di sicurezza.\n\n**Controllo:** Non dedurre che «locale» implichi assenza di trasmissione a un LLM cloud.","en":"Classify three scenarios—same-PC use, network service, sensitive data access—by transport and security controls.\n\n**Check:** Do not infer that “local” means no data is transmitted to a cloud LLM."}}]}],"quiz":[{"q":{"it":"Chi ospita la sessione AI?","en":"Who hosts the AI session?"},"opts":{"it":["Il Server MCP","L’Host","La Revit API"],"en":["The MCP server","The host","The Revit API"]},"correct":1,"why":{"it":"L’Host gestisce esperienza, client e policy.","en":"The host manages the experience, clients and policies."}},{"q":{"it":"Quale metodo è usato per richiamare un Tool?","en":"Which method invokes a tool?"},"opts":{"it":["tools/call","tools/style","revit/execute"],"en":["tools/call","tools/style","revit/execute"]},"correct":0,"why":{"it":"tools/call è il metodo MCP per richiamare un Tool.","en":"tools/call is the MCP method for invoking tools."}},{"q":{"it":"STDIO viene usato spesso quando...","en":"STDIO is commonly used when..."},"opts":{"it":["il server è un sottoprocesso locale","serve un dominio Internet","non esistono processi"],"en":["the server is a local subprocess","an Internet domain is required","there are no processes"]},"correct":0,"why":{"it":"In STDIO il client avvia e comunica con un processo.","en":"With STDIO the client launches and communicates with a process."}},{"q":{"it":"È sicuro scrivere log arbitrari su stdout di un server STDIO?","en":"Is it safe to print arbitrary logs to stdout in a STDIO MCP server?"},"opts":{"it":["Sì","No","Solo con file IFC"],"en":["Yes","No","Only with IFC files"]},"correct":1,"why":{"it":"stdout è destinato ai messaggi MCP.","en":"stdout is reserved for MCP protocol messages."}},{"q":{"it":"Dove si definiscono i permessi di esecuzione lato utente?","en":"Where are user-facing execution permissions handled?"},"opts":{"it":["Solo dentro la geometria IFC","Nell’host e nelle configurazioni del server","Nel nome del Tool"],"en":["Only in IFC geometry","In host controls and server configuration","In the tool name"]},"correct":1,"why":{"it":"I permessi non si deducono dal solo protocollo o dal prompt.","en":"Permissions are not inferred from the protocol or the prompt alone."}}]},{"id":"m3","title":{"it":"Tools, Resources e Prompts","en":"Tools, Resources and Prompts"},"subtitle":{"it":"Definizioni, schemi, risultati e messaggi","en":"Definitions, schemas, results and messages"},"mins":40,"lessons":[{"id":"a3.1","title":{"it":"Definire un Tool","en":"Defining a tool"},"mins":15,"kind":"ifc","steps":[{"title":{"it":"Il concetto","en":"The concept"},"text":{"it":"Un Tool è una funzione che il server offre a un client: il suo contratto dichiara nome, descrizione e schema degli argomenti. Una buona descrizione specifica cosa fa davvero la funzione, limiti e unità di misura; aiuta il modello a non selezionare il Tool sbagliato.","en":"A tool is a function offered by a server to its client: its contract declares name, description, and argument schema. A good description states what the function really does, its limits, and units; this helps the model avoid choosing the wrong tool."}},{"title":{"it":"Come funziona","en":"How it works"},"text":{"it":"Uno schema JSON può richiedere un parametro `category` e limitare i valori accettati. Il modello propone gli argomenti, ma il server deve validarli comunque. La risposta va distinta da una spiegazione generata dall’LLM: è un risultato dell’esecuzione.","en":"A JSON schema may require a `category` argument and restrict accepted values. The model proposes arguments, but the server must validate them regardless. The response differs from an LLM explanation: it is an execution result."},"code":"{\"name\":\"count_by_category\",\"description\":\"Count IFC entities in the course snapshot\",\"inputSchema\":{\"type\":\"object\",\"properties\":{\"category\":{\"type\":\"string\"}},\"required\":[\"category\"]}}"},{"title":{"it":"Caso applicativo","en":"Applied example"},"text":{"it":"Il Tool dimostrativo `count_by_category` riceve `IfcWall` e restituisce 30 per lo snapshot IFC del corso. Non è il nome di un Tool Autodesk e non prova il conteggio corrente nel modello RVT aperto.","en":"The demo tool `count_by_category` receives `IfcWall` and returns 30 for the course IFC snapshot. It is not an Autodesk tool name and does not prove the live open RVT model count."},"widget":"ifc"},{"title":{"it":"Esercitazione e verifica","en":"Practice and verify"},"text":{"it":"Individua nome, argomento obbligatorio, tipo di ritorno e possibili errori nella definizione dimostrativa.\n\n**Controllo:** Un server reale dovrebbe distinguere categoria inesistente, dato assente e errore di connessione.","en":"Identify name, required argument, return type and possible errors in the demo definition.\n\n**Check:** A real server should distinguish an unknown category, missing data and connection failure."}}]},{"id":"a3.2","title":{"it":"Resources, Prompts e URI","en":"Resources, Prompts and URIs"},"mins":10,"kind":"theory","steps":[{"title":{"it":"Il concetto","en":"The concept"},"text":{"it":"Una Resource è un contenuto consultabile, di norma identificato da URI. Un Prompt è un modello di istruzioni riutilizzabile con eventuali argomenti. Diversamente dai Tools, questi meccanismi non descrivono necessariamente l’esecuzione di un’azione esterna.","en":"A resource is readable content, typically identified by a URI. A prompt is a reusable instruction template, optionally parameterised. Unlike tools, these mechanisms do not necessarily describe an executable external action."}},{"title":{"it":"Come funziona","en":"How it works"},"text":{"it":"Il server può esporre `bim://project/overview` come risorsa informativa e un prompt `review_missing_parameters` come traccia guidata. Il supporto concreto dipende dalle primitive implementate; non tutti i server espongono tutte le tipologie.","en":"A server might expose `bim://project/overview` as an information resource and `review_missing_parameters` as a reusable prompt. Support depends on implementation; not every server implements all primitive types."}},{"title":{"it":"Caso applicativo","en":"Applied example"},"text":{"it":"Le proprietà IFC associate a un edificio potrebbero costituire una Resource JSON, mentre un controllo di completezza su categorie multiple può richiedere uno o più Tools. Non attribuire un’azione a una Resource senza definirne il comportamento.","en":"IFC properties associated with a building could be exposed as a JSON resource, while completeness checks across categories may require one or more tools. Do not attribute executable actions to a resource without defining them."}},{"title":{"it":"Esercitazione e verifica","en":"Practice and verify"},"text":{"it":"Classifica: (1) contenuto IFC leggibile, (2) funzione di lettura parametri, (3) traccia di controllo informativo riutilizzabile.\n\n**Controllo:** La corrispondenza attesa è Resource, Tool, Prompt.","en":"Classify: (1) readable IFC content, (2) parameter retrieval function, (3) reusable information-check template.\n\n**Check:** The expected mapping is Resource, Tool, Prompt."}}]},{"id":"a3.3","title":{"it":"Messaggi strutturati ed errori","en":"Structured messages and errors"},"mins":15,"kind":"ifc","steps":[{"title":{"it":"Il concetto","en":"The concept"},"text":{"it":"Le richieste MCP utilizzano JSON-RPC 2.0 come struttura di base. L’oggetto di richiesta contiene un metodo, parametri e identificativo; una risposta può riportare un risultato oppure un errore. Un Tool può inoltre segnalare un errore applicativo nel proprio risultato.","en":"MCP requests use JSON-RPC 2.0 as their messaging basis. A request has a method, parameters and an identifier; a response may contain a result or an error. A tool may also report an application-level error in its result."}},{"title":{"it":"Come funziona","en":"How it works"},"text":{"it":"Un Tool dovrebbe trattare esplicitamente valori nulli, categorie prive di oggetti, problemi di autorizzazione e timeout. In BIM va posta attenzione a unità, tipi di dati, GUID e differenza tra entità IFC e oggetti di Revit.","en":"A tool should explicitly handle null values, empty categories, authorisation failures and timeouts. In BIM, units, data types, GUIDs and differences between IFC entities and Revit objects deserve special attention."},"code":"{\"jsonrpc\":\"2.0\",\"id\":2,\"method\":\"tools/call\",\"params\":{\"name\":\"demo_count_by_category\",\"arguments\":{\"category\":\"IfcWindow\"}}}"},{"title":{"it":"Caso applicativo","en":"Applied example"},"text":{"it":"Una richiesta valida `tools/call` potrebbe chiedere `category=IfcWindow`. Nel file IFC fornito sono presenti 7 istanze `IfcWindow`; una chiamata a un server reale andrebbe comunque verificata sul documento corrente.","en":"A valid `tools/call` might request `category=IfcWindow`. The supplied IFC contains 7 `IfcWindow` instances; a live server query still needs validation against the current document."},"widget":"ifc"},{"title":{"it":"Esercitazione e verifica","en":"Practice and verify"},"text":{"it":"Confronta i tre esiti: 7 elementi, 0 elementi e errore di connessione. Spiega perché non sono intercambiabili.\n\n**Controllo:** Un elenco vuoto è un risultato valido; un errore significa che l’operazione non è stata completata.","en":"Compare three outcomes: seven elements, zero elements, and a connection error. Explain why they are not interchangeable.\n\n**Check:** An empty list may be valid; an error means the operation was not completed."}}]}],"quiz":[{"q":{"it":"Quale parte descrive gli argomenti ammessi da un Tool?","en":"What declares allowed tool arguments?"},"opts":{"it":["inputSchema","IfcSite","README soltanto"],"en":["inputSchema","IfcSite","README only"]},"correct":0,"why":{"it":"Lo schema definisce la struttura attesa degli input.","en":"The schema defines the expected input structure."}},{"q":{"it":"Un identificativo URI di contenuto caratterizza soprattutto...","en":"A content URI chiefly characterises..."},"opts":{"it":["un Resource","una Transaction Revit","un LLM"],"en":["a Resource","a Revit Transaction","an LLM"]},"correct":0,"why":{"it":"Le risorse sono accessibili tramite identificatori.","en":"Resources are addressed by identifiers."}},{"q":{"it":"Un Prompt MCP è...","en":"An MCP Prompt is..."},"opts":{"it":["un file RVT","una traccia di istruzioni riutilizzabile","un Tool sempre distruttivo"],"en":["an RVT file","a reusable instruction template","an always-destructive Tool"]},"correct":1,"why":{"it":"I Prompt forniscono template, non necessariamente operazioni.","en":"Prompts provide templates, not necessarily operations."}},{"q":{"it":"Qual è il metodo JSON-RPC per eseguire un Tool?","en":"Which JSON-RPC method executes a tool?"},"opts":{"it":["tools/call","tools/scanBIM","ifc/query"],"en":["tools/call","tools/scanBIM","ifc/query"]},"correct":0,"why":{"it":"tools/call è previsto dal protocollo MCP.","en":"tools/call is defined by MCP."}},{"q":{"it":"Una risposta con zero elementi significa sempre un errore?","en":"Does a result containing zero elements always mean an error?"},"opts":{"it":["Sì","No, può essere un risultato valido","Significa scrittura del modello"],"en":["Yes","No, it may be a valid result","It means a model write"]},"correct":1,"why":{"it":"La lista vuota non coincide con un fallimento.","en":"An empty list is not necessarily a failure."}}]},{"id":"m4","title":{"it":"Primo server MCP","en":"Your first MCP server"},"subtitle":{"it":"Ambiente gratuito, test con Inspector, debug","en":"Free tools, Inspector testing, debugging"},"mins":45,"lessons":[{"id":"a4.1","title":{"it":"Preparare gli strumenti","en":"Prepare the environment"},"mins":10,"kind":"theory","steps":[{"title":{"it":"Il concetto","en":"The concept"},"text":{"it":"Per comprendere un server non serve acquistare un LLM. Installeremo Python, uno strumento di gestione dell’ambiente (`uv`) e il pacchetto ufficiale `mcp[cli]`. L’Inspector permette di vedere Tools e risposte indipendentemente da una chat AI.","en":"You do not need to buy an LLM to understand an MCP server. Install Python, the `uv` environment manager, and the official `mcp[cli]` package. The Inspector exposes tools and responses independently of an AI chat."}},{"title":{"it":"Come funziona","en":"How it works"},"text":{"it":"Crea una cartella isolata per il laboratorio e usa un ambiente virtuale. L’Inspector basato su Node richiede anche la disponibilità di `npx`; la procedura `uv run mcp dev server.py` è documentata dallo SDK Python v2.","en":"Create an isolated lab folder and virtual environment. The Node-based Inspector also needs `npx`; the `uv run mcp dev server.py` workflow is documented by the Python SDK v2."},"code":"uv init mcp-lab\ncd mcp-lab\nuv add \"mcp[cli]\""},{"title":{"it":"Caso applicativo","en":"Applied example"},"text":{"it":"Prepara un ambiente per lavorare con dati BIM esemplificativi, senza Revit. In seguito la stessa architettura di Tool sarà riutilizzata nel modulo di sviluppo.","en":"Prepare an environment to work with sample BIM data without Revit. The same tool-interface concepts will later be reused in the development module."}},{"title":{"it":"Esercitazione e verifica","en":"Practice and verify"},"text":{"it":"Esegui `python --version`, `uv --version`, `node --version` e `npx --version` da terminale, quindi registra i risultati.\n\n**Controllo:** Python 3.10+ è il minimo dichiarato dallo SDK corrente; usa preferibilmente Python 3.11+ e versioni Node supportate.","en":"Run `python --version`, `uv --version`, `node --version`, and `npx --version` in a terminal and record the outputs.\n\n**Check:** The current SDK documents Python 3.10+; prefer Python 3.11+ and supported Node versions."}}]},{"id":"a4.2","title":{"it":"Eseguire un Tool dimostrativo","en":"Run a demo tool"},"mins":20,"kind":"ifc","steps":[{"title":{"it":"Il concetto","en":"The concept"},"text":{"it":"Un server MCP Python può registrare funzioni con il decoratore `@mcp.tool()`. Il nome, la documentazione e le annotazioni dei tipi definiscono una parte importante del contratto del Tool. La funzione Python resta codice normale, quindi può essere verificata anche senza un modello AI.","en":"A Python MCP server can register functions with `@mcp.tool()`. Function names, docstrings and type annotations contribute to the tool contract. The function remains ordinary Python code, so it can also be tested without a language model."}},{"title":{"it":"Come funziona","en":"How it works"},"text":{"it":"Il server demo espone `get_course_model_counts`, una funzione che legge uno snapshot statico di conteggi dell’IFC. Le quantità sono numeri osservati nell’esportazione allegata al corso, non risultati ottenuti direttamente da un MCP per Revit.","en":"The demo server exposes `get_course_model_counts`, reading static counts from the course IFC snapshot. Those quantities were observed in the supplied IFC export; they are not the result of a live Revit MCP call."},"code":"from mcp.server import MCPServer\nmcp = MCPServer(\"BIM Academy\")\nCOUNTS = {\"IfcWall\":30,\"IfcDoor\":15,\"IfcWindow\":7}\n\n@mcp.tool()\ndef get_course_model_counts(category: str) -> int:\n    \"\"\"Count a category in the static training snapshot.\"\"\"\n    return COUNTS.get(category, 0)\n\nif __name__ == \"__main__\":\n    mcp.run(transport=\"stdio\")"},{"title":{"it":"Caso applicativo","en":"Applied example"},"text":{"it":"Nel dataset didattico trovi 30 pareti, 15 porte e 7 finestre. Prima di eseguire il Tool, prevedi il risultato di una richiesta sulla categoria `IfcDoor`.","en":"The learning dataset contains 30 walls, 15 doors and 7 windows. Before calling the tool, predict the outcome for `IfcDoor`."},"widget":"ifc"},{"title":{"it":"Esercitazione e verifica","en":"Practice and verify"},"text":{"it":"Scarica il progetto demo dal pacchetto del Developer Lab, avvia `mcp dev`, richiama il Tool e confronta risultato e schema.\n\n**Controllo:** Il numero atteso nello snapshot per `IfcDoor` è 15. Un eventuale errore di importazione dipende dall’ambiente Python, non dal file RVT.","en":"Download the demo project from the Developer Lab package, run `mcp dev`, call the tool and compare response with schema.\n\n**Check:** The expected IFC snapshot count for `IfcDoor` is 15. Python import errors belong to the development environment, not to the RVT file."}}]},{"id":"a4.3","title":{"it":"Inspector e debugging","en":"Inspector and debugging"},"mins":15,"kind":"theory","steps":[{"title":{"it":"Il concetto","en":"The concept"},"text":{"it":"L’MCP Inspector è uno strumento di ispezione con cui esplorare gli strumenti annunciati da un server, verificarne gli schemi, invocare le funzioni e leggere risultati ed errori. Non richiede un abbonamento AI.","en":"MCP Inspector lets you inspect a server’s advertised tools, verify their schemas, invoke functions, and review results and errors. It needs no paid AI subscription."}},{"title":{"it":"Come funziona","en":"How it works"},"text":{"it":"Per un server avviato via STDIO, evita `print()` su stdout: i log interferirebbero con i messaggi MCP. Se Inspector non trova il Tool, verifica ambiente virtuale, entrypoint, errori di avvio e nome della funzione.","en":"With a STDIO-launched server, avoid `print()` on stdout: logs can interfere with MCP messages. If Inspector cannot find the tool, check the virtual environment, entrypoint, startup errors and the function name."},"code":"uv run mcp dev server.py"},{"title":{"it":"Caso applicativo","en":"Applied example"},"text":{"it":"Testa prima la categoria corretta `IfcWindow`, poi una stringa inesistente. Una funzione dimostrativa può restituire zero, ma un server di produzione dovrebbe decidere se segnalare esplicitamente la categoria sconosciuta.","en":"Test the valid `IfcWindow` category first, then an unknown string. A demo function might return zero, but a production server should decide whether an unknown category deserves an explicit validation error."}},{"title":{"it":"Esercitazione e verifica","en":"Practice and verify"},"text":{"it":"Annota: nome Tool, parametri, risposta, tempo di esecuzione, problemi e risoluzione.\n\n**Controllo:** Completa la checklist del laboratorio; nel corso nessun quiz dipende da un abbonamento AI.","en":"Record: tool name, parameters, response, execution time, issues and resolution.\n\n**Check:** Complete the lab checklist; no course quiz depends on a paid AI plan."}}]}],"quiz":[{"q":{"it":"A cosa serve MCP Inspector?","en":"What is MCP Inspector for?"},"opts":{"it":["Modellare muri","Testare Tools e risposte","Compilare Revit"],"en":["Modelling walls","Testing tools and responses","Compiling Revit"]},"correct":1,"why":{"it":"Permette di provare server e Tools indipendentemente da un LLM.","en":"It tests servers and tools independently from an LLM."}},{"q":{"it":"Cosa registra `@mcp.tool()`?","en":"What does `@mcp.tool()` register?"},"opts":{"it":["Una funzione MCP richiamabile","Un materiale IFC","Una schermata Revit"],"en":["A callable MCP function","An IFC material","A Revit screen"]},"correct":0,"why":{"it":"Il decoratore espone la funzione come Tool.","en":"The decorator exposes the function as a tool."}},{"q":{"it":"Quale comando è documentato per il testing dello SDK v2?","en":"Which command is documented for SDK v2 testing?"},"opts":{"it":["mcp sketch","uv run mcp dev server.py","revit /ifc"],"en":["mcp sketch","uv run mcp dev server.py","revit /ifc"]},"correct":1,"why":{"it":"Il comando avvia l’ambiente di test Inspector.","en":"The command launches the Inspector testing workflow."}},{"q":{"it":"È indispensabile un abbonamento LLM per provare un Tool con Inspector?","en":"Is a paid LLM required to test a tool with Inspector?"},"opts":{"it":["Sì","Solo su Windows","No"],"en":["Yes","Only on Windows","No"]},"correct":2,"why":{"it":"Inspector esegue chiamate di protocollo senza bisogno di un LLM.","en":"Inspector makes protocol calls without needing an LLM."}},{"q":{"it":"I conteggi nello snapshot demo indicano il numero attuale di oggetti RVT?","en":"Do demo snapshot counts prove live RVT counts?"},"opts":{"it":["No","Sì, sempre","Solo per le porte"],"en":["No","Yes, always","Only for doors"]},"correct":0,"why":{"it":"I conteggi descrivono la versione IFC fornita, non lo stato corrente in Revit.","en":"Counts describe the supplied IFC export, not the live Revit state."}}]},{"id":"m5","title":{"it":"MCP per Autodesk Revit","en":"MCP for Autodesk Revit"},"subtitle":{"it":"Revit API, server ufficiale, affidabilità","en":"Revit API, official servers, reliability"},"mins":40,"lessons":[{"id":"a5.1","title":{"it":"L’architettura Revit–MCP","en":"The Revit–MCP architecture"},"mins":10,"kind":"flow","steps":[{"title":{"it":"Il concetto","en":"The concept"},"text":{"it":"Autodesk distribuisce un add-on MCP per Revit 2027. Il client compatibile usa un server locale STDIO, mentre Revit mantiene il documento e le proprie API. Per capire l’integrazione devi distinguere il modello RVT in memoria, il risultato delle API e la risposta elaborata dall’LLM.","en":"Autodesk provides an MCP add-on for Revit 2027. A compatible client talks to a local STDIO server, while Revit owns the document and its APIs. Understand the distinction between live RVT data, API output, and the LLM-generated explanation."}},{"title":{"it":"Come funziona","en":"How it works"},"text":{"it":"Una richiesta in linguaggio naturale arriva all’host AI, che sceglie uno dei Tool esposti dal server. Il server implementa il proprio accesso a Revit e invia i risultati; l’utente deve poter verificare dati e operazioni.","en":"A natural-language request reaches the AI host, which selects an exposed tool. The server implements access to Revit and returns results; the user must be able to verify values and operations."}},{"title":{"it":"Caso applicativo","en":"Applied example"},"text":{"it":"Nel modello didattico fornito, il file IFC contiene 6 entità `IfcBuildingStorey`. Non è corretto dedurre automaticamente che il server Revit esponga esattamente 6 livelli senza una query reale.","en":"The supplied course IFC contains six `IfcBuildingStorey` entities. That does not prove that the Revit server will report exactly six levels without a live query."},"widget":"flow"},{"title":{"it":"Esercitazione e verifica","en":"Practice and verify"},"text":{"it":"Segna nel diagramma la posizione del client AI, server Revit, add-in e documento. Individua dove avviene la conversione in linguaggio naturale.\n\n**Controllo:** La risposta dell’LLM non è l’origine dei dati BIM; deve essere collegata alle informazioni restituite dai Tools.","en":"Label the AI client, Revit server, add-in and document in the diagram. Identify where natural-language interpretation occurs.\n\n**Check:** The LLM’s answer is not the BIM data origin; it must be grounded in tool results."}}]},{"id":"a5.2","title":{"it":"Read, Write, Experimental","en":"Read, Write, Experimental"},"mins":15,"kind":"theory","steps":[{"title":{"it":"Il concetto","en":"The concept"},"text":{"it":"Autodesk distingue i server Read, Write ed Experimental nella Technical Preview. Read espone operazioni di sola lettura; Write include anche Tools che modificano il modello; Experimental aggiunge funzionalità sperimentali. La disponibilità e i nomi precisi dei Tools possono cambiare con gli aggiornamenti.","en":"Autodesk distinguishes Read, Write and Experimental servers in the Technical Preview. Read exposes non-mutating actions; Write adds model-changing tools; Experimental adds experimental functionality. Exact tool names and availability can change with updates."}},{"title":{"it":"Come funziona","en":"How it works"},"text":{"it":"Per ciascuna attività valuta il livello di permesso più basso che la renda possibile. Una ricerca di porte dovrebbe partire da Read. Una scrittura di parametro richiede capacità Write, il giusto contesto Revit e la conferma dell’utente dove prevista.","en":"For every activity, choose the least powerful server necessary. Finding doors should start with Read. Editing a parameter requires write capabilities, an appropriate Revit context and user approval when requested."}},{"title":{"it":"Caso applicativo","en":"Applied example"},"text":{"it":"Fra i flussi illustrati da Autodesk figurano ricerca elementi, parametri, report, navigazione viste ed esportazione viste. Non assumere che un comando inventato nella lezione esista nel catalogo effettivo.","en":"Autodesk documents workflows such as searching elements, retrieving parameters, producing reports, navigating views and exporting views. Do not assume a tool name invented for a lesson is actually supported."}},{"title":{"it":"Esercitazione e verifica","en":"Practice and verify"},"text":{"it":"Classifica le richieste «conta fi
