nestre», «aggiorna commenti» e «crea geometrie sperimentali» scegliendo il livello di privilegio plausibile.\n\n**Controllo:** Read per lettura; Write per modifica supportata; Experimental soltanto se la funzione richiesta è effettivamente esposta e verificata.","en":"Classify “count windows”, “update comments” and “create experimental geometry” by plausible permission level.\n\n**Check:** Read for non-mutating queries; Write for supported edits; Experimental only if the requested function is actually exposed and verified."}}]},{"id":"a5.3","title":{"it":"Affidabilità, privacy e rischi","en":"Reliability, privacy and risk"},"mins":15,"kind":"ifc","steps":[{"title":{"it":"Il concetto","en":"The concept"},"text":{"it":"I risultati di una Tool call possono essere corretti mentre la sintesi dell’AI risulta incompleta, o viceversa. La verifica richiede controlli su categorie, unità, filtri, fasi, opzioni di progetto e natura del parametro (tipo/istanza). Il sistema AI non sostituisce un processo di validazione BIM.","en":"A tool call can return accurate data while the AI summary is incomplete, or vice versa. Verification must account for categories, units, filters, phases, design options, and whether a parameter is type- or instance-based. AI does not replace BIM validation."}},{"title":{"it":"Come funziona","en":"How it works"},"text":{"it":"L’add-on ufficiale opera localmente, ma il client AI può trasmettere contenuti estratti a un servizio cloud. Usa un modello autorizzato e limita le informazioni condivise. Evita Tools di scrittura nei primi esercizi e lavora sempre su copie per le modifiche.","en":"The official add-on runs locally, but the AI client may forward extracted content to a cloud service. Use an authorised model and limit exposed information. Start with read-only tools and use a project copy for changes."}},{"title":{"it":"Caso applicativo","en":"Applied example"},"text":{"it":"Il file IFC didattico contiene metadati di esportazione. MCP Academy pubblica soltanto conteggi e valori necessari agli esercizi; i file RVT/IFC originali non sono inclusi automaticamente nel sito.","en":"The course IFC includes export metadata. MCP Academy publishes only counts and values necessary for exercises; the original RVT/IFC files are not automatically included on the website."},"widget":"ifc"},{"title":{"it":"Esercitazione e verifica","en":"Practice and verify"},"text":{"it":"Prepara una checklist di verifica per una tabella di porte: totali, elementi campionati, proprietà, unità e documentazione dei Tool effettivamente usati.\n\n**Controllo:** Il prompt deve chiedere esplicitamente di segnalare l’assenza di Tool o dati, invece di inventare risultati.","en":"Prepare a validation checklist for a door schedule: totals, sampled elements, properties, units and the tools actually used.\n\n**Check:** The prompt should explicitly ask to report missing tools or data rather than fabricate outputs."}}]}],"quiz":[{"q":{"it":"Quale server privilegiare per una semplice interrogazione?","en":"Which server should you prefer for a simple query?"},"opts":{"it":["Write","Read","Experimental"],"en":["Write","Read","Experimental"]},"correct":1,"why":{"it":"Applica il principio del privilegio minimo.","en":"Use the least-privilege principle."}},{"q":{"it":"MCP sostituisce la Revit API?","en":"Does MCP replace the Revit API?"},"opts":{"it":["No","Sì","Solo dal 2027"],"en":["No","Yes","Only since 2027"]},"correct":0,"why":{"it":"MCP può esporre funzioni implementate tramite API.","en":"MCP can expose functions implemented through APIs."}},{"q":{"it":"Quale versione di Revit viene utilizzata nei laboratori MCP Academy?","en":"Which Revit version is used in the MCP Academy labs?"},"opts":{"it":["Revit 2020","Revit 2027.3","Unicamente IFC2x3"],"en":["Revit 2020","Revit 2027.3","Only IFC2x3"]},"correct":1,"why":{"it":"Questa Academy adotta Revit 2027.3, con compatibilità confermata dall’autore.","en":"This Academy targets Revit 2027.3, with compatibility confirmed by the author."}},{"q":{"it":"Se l’LLM restituisce un conteggio senza evidenza...","en":"If an LLM gives a count without evidence..."},"opts":{"it":["va verificato sul modello","è definitivo","è sempre falso"],"en":["verify it against the model","it is final","it is always false"]},"correct":0,"why":{"it":"Il risultato richiede tracciabilità dei dati e controlli.","en":"Results need data traceability and checks."}},{"q":{"it":"Un server Read può modificare parametri?","en":"Can a Read server edit parameters?"},"opts":{"it":["Sì, sempre","No, per definizione","Solo tramite screenshot"],"en":["Yes, always","No, by design","Only through screenshots"]},"correct":1,"why":{"it":"Read espone operazioni che non modificano il modello.","en":"Read exposes non-mutating operations."}}]},{"id":"m6","title":{"it":"Installazione e connessione a Revit","en":"Installing and connecting to Revit"},"subtitle":{"it":"Add-on Autodesk, Claude Desktop e test di connessione","en":"Autodesk add-on, Claude Desktop and connection test"},"mins":55,"lessons":[{"id":"a6.1","title":{"it":"Prerequisiti e compatibilità","en":"Prerequisites and compatibility"},"mins":15,"kind":"ifc","steps":[{"title":{"it":"Il concetto","en":"The concept"},"text":{"it":"Per i laboratori del corso utilizziamo Revit 2027.3, la cui compatibilità con il server MCP Autodesk è stata confermata dall’autore. Occorre installare l’add-on MCP corrispondente. Revit deve essere aperto con un documento caricato. Serve inoltre un client che supporti server locali STDIO: in questo corso il riferimento è Claude Desktop, senza richiedere un abbonamento a pagamento.","en":"These labs use Revit 2027.3, with compatibility with the Autodesk MCP server confirmed by the course author. Install the corresponding MCP add-on. Revit must be running with a model open. You also need an AI client supporting local STDIO servers: this course uses Claude Desktop without requiring a paid subscription."}},{"title":{"it":"Come funziona","en":"How it works"},"text":{"it":"Il file IFC didattico riporta un’esportazione da Revit 27.3.0.28, coerente con la versione utilizzata per i laboratori. Se utilizzi un’altra build, verifica prima la compatibilità dell’add-on MCP e dei Tools.","en":"The training IFC header reports an export from Revit 27.3.0.28, consistent with the lab version. For a different build, check MCP add-on and tool compatibility first."}},{"title":{"it":"Caso applicativo","en":"Applied example"},"text":{"it":"Il file comune è un edificio residenziale unifamiliare. Se hai una copia RVT autorizzata, aprila in Revit e verificane la versione. Il sito non distribuisce per ora i file originali.","en":"The shared case is a single-family house. If you have an authorised RVT copy, open it in Revit and check its version. The website does not currently distribute the original files."},"widget":"ifc"},{"title":{"it":"Esercitazione e verifica","en":"Practice and verify"},"text":{"it":"Controlla Revit About, Autodesk Account, disponibilità dell’add-on Read e versione di Claude Desktop.\n\n**Controllo:** In caso di dubbio sulla build, non passare a Write/Experimental: conferma prima la connessione Read.","en":"Check Revit About, Autodesk Account, the Read add-on availability and your Claude Desktop version.\n\n**Check:** If uncertain about your build, do not proceed to Write/Experimental: validate a Read connection first."}}]},{"id":"a6.2","title":{"it":"Installazione add-on e configurazione","en":"Install the add-on and configure the client"},"mins":20,"kind":"theory","steps":[{"title":{"it":"Il concetto","en":"The concept"},"text":{"it":"Da Autodesk Account, nella sezione Revit 2027 Extensions, installa `Revit MCP Server Read-Tools Technical Preview` secondo la disponibilità del tuo account. Claude Desktop utilizza il file JSON di configurazione dei server MCP locali, accessibile da Settings → Developer → Edit Config.","en":"From Autodesk Account, under Revit 2027 Extensions, install `Revit MCP Server Read-Tools Technical Preview` as available in your account. Claude Desktop reads local server definitions from a JSON config file opened via Settings → Developer → Edit Config."}},{"title":{"it":"Come funziona","en":"How it works"},"text":{"it":"Nel file, `command` punta all’eseguibile realmente installato e `args` contiene gli argomenti necessari. In JSON, i percorsi Windows richiedono due backslash. Non cancellare altre voci in `mcpServers` se usi già altri server.","en":"In the file, `command` points at the actually installed executable and `args` contains required options. Windows paths in JSON use escaped backslashes. Do not erase other entries in `mcpServers` if other servers are already configured."},"code":"{\n  \"mcpServers\": {\n    \"Revit MCP Read-Tools Technical Preview\": {\n      \"command\": \"C:\\\\Program Files\\\\Autodesk\\\\Revit 2027 MCP Server Read-Tools Technical Preview\\\\Autodesk.RevitMcpServer.Stdio.exe\",\n      \"args\": [\"--ManageConfigurationWithAutodeskRevitPluginInstaller=true\"]\n    }\n  }\n}"},{"title":{"it":"Caso applicativo","en":"Applied example"},"text":{"it":"La configurazione riportata nell’esempio è quella Read pubblicata da Autodesk, non un Tool di scrittura. Dopo aver salvato il file, chiudi completamente e riavvia Claude Desktop.","en":"The example configuration is Autodesk’s published Read setup, not a write tool. Save the file, fully quit Claude Desktop, then restart it."}},{"title":{"it":"Esercitazione e verifica","en":"Practice and verify"},"text":{"it":"Verifica il percorso `.exe` in Esplora File, poi confronta la configurazione con la documentazione ufficiale collegata nel corso.\n\n**Controllo:** Un backslash non escapato o una virgola finale rendono il file JSON invalido.","en":"Verify the executable path in File Explorer, then compare your configuration with the official documentation linked by the course.\n\n**Check:** An unescaped backslash or a trailing comma makes the JSON invalid."}}]},{"id":"a6.3","title":{"it":"Prima connessione e troubleshooting","en":"First connection and troubleshooting"},"mins":20,"kind":"lab","steps":[{"title":{"it":"Il concetto","en":"The concept"},"text":{"it":"Apri Revit con un documento di prova, poi Claude Desktop e controlla la disponibilità del server. La prima richiesta deve essere non distruttiva: «Elenca i Tools Revit disponibili e i loro parametri». Solo dopo prova un’interrogazione limitata, citando il nome del Tool realmente trovato.","en":"Open Revit with a training document, then Claude Desktop and verify server availability. The first request should be non-destructive: “List available Revit tools and their arguments.” Only then try a narrow data query, referring to an actually discovered tool."}},{"title":{"it":"Come funziona","en":"How it works"},"text":{"it":"Se il server non appare, ricontrolla build Revit, installazione add-on, percorso, sintassi JSON, riavvio completo del client e permessi. Se appare ma non restituisce dati, assicurati che un progetto sia aperto e che il Tool richiesto sia compatibile.","en":"If the server does not appear, check the Revit build, add-on installation, executable path, JSON syntax, complete client restart and permissions. If it connects without results, confirm a project is open and the requested tool is supported."}},{"title":{"it":"Caso applicativo","en":"Applied example"},"text":{"it":"Prompt di avvio consigliato: «List the available Revit MCP tools. For each, show its name, required arguments, whether it is read-only and its limitations. Do not modify the model.»","en":"Recommended initial prompt: “List the available Revit MCP tools. For each, show its name, required arguments, whether it is read-only and its limitations. Do not modify the model.”"}},{"title":{"it":"Esercitazione e verifica","en":"Practice and verify"},"text":{"it":"Conserva un breve log della connessione (versione, data, Tools visti) e verifica la prima risposta sul modello.\n\n**Controllo:** Quando il piano AI gratuito impone un limite, riprendi al reset del servizio o usa MCP Inspector per i test di protocollo disponibili; non acquistare crediti API per completare il corso.","en":"Keep a brief connection log (version, date, discovered tools) and validate the first answer against the model.\n\n**Check:** If the free AI plan hits a limit, continue after its reset or use MCP Inspector for protocol-level tests where possible; no paid API credits are required for course completion."}}]}],"quiz":[{"q":{"it":"Quale configurazione server è suggerita per iniziare?","en":"Which server configuration is recommended for a first connection?"},"opts":{"it":["Read","Experimental","Write obbligatorio"],"en":["Read","Experimental","Mandatory Write"]},"correct":0,"why":{"it":"La lettura limita il rischio di modifiche involontarie.","en":"Read limits the risk of accidental edits."}},{"q":{"it":"Dove si configura un server locale in Claude Desktop?","en":"Where is a local server configured in Claude Desktop?"},"opts":{"it":["Solo in Revit Family Editor","Settings → Developer → Edit Config","Dentro IFC header"],"en":["Only in Revit Family Editor","Settings → Developer → Edit Config","Inside the IFC header"]},"correct":1,"why":{"it":"Il file `claude_desktop_config.json` descrive i server.","en":"`claude_desktop_config.json` lists local servers."}},{"q":{"it":"In una stringa JSON il backslash Windows va...","en":"In a JSON string a Windows backslash must be..."},"opts":{"it":["escapato","rimosso sempre","sostituito con hashtag"],"en":["escaped","always removed","replaced by a hashtag"]},"correct":0,"why":{"it":"Usa backslash doppi nelle stringhe di percorso JSON.","en":"Use double backslashes in JSON path strings."}},{"q":{"it":"Quale controllo fare prima di invocare un Tool specifico?","en":"What should you do before requesting a specific tool?"},"opts":{"it":["Scoprire i Tools disponibili","Modificare i file IFC","Disabilitare Revit"],"en":["Discover available tools","Edit IFC files","Disable Revit"]},"correct":0,"why":{"it":"La Tool discovery evita nomi inventati.","en":"Tool discovery avoids made-up tool names."}},{"q":{"it":"La versione 27.3 nell’IFC prova la compatibilità del server MCP?","en":"Does a 27.3 exporter version in IFC prove MCP server compatibility?"},"opts":{"it":["Sì","No","Solo per gli IfcWall"],"en":["Yes","No","Only for IfcWall"]},"correct":1,"why":{"it":"Le dichiarazioni di supporto e una prova reale sono fonti distinte.","en":"Support statements and live testing are separate evidence."}}]},{"id":"m7","title":{"it":"Laboratori BIM sul modello comune","en":"BIM labs using the shared model"},"subtitle":{"it":"Esercizi Read verificabili e report informativi","en":"Verifiable Read exercises and information reports"},"mins":95,"lessons":[{"id":"a7.1","title":{"it":"Prima interrogazione BIM","en":"First BIM query"},"mins":15,"kind":"ifc","steps":[{"title":{"it":"Il concetto","en":"The concept"},"text":{"it":"Un laboratorio riproducibile inizia da un documento identificato e da una domanda limitata. Apri una copia del RVT didattico, verifica che il server Read sia collegato e chiedi al client di elencare la categoria interrogabile e gli strumenti effettivamente utilizzati.","en":"A reproducible lab starts from a known document and a narrow question. Open a copy of the training RVT, verify the Read server connection, and ask the client to report the queried category and the tools actually used."}},{"title":{"it":"Come funziona","en":"How it works"},"text":{"it":"Il riferimento IFC4X3_ADD2 contiene 30 `IfcWall`, 15 `IfcDoor` e 7 `IfcWindow`. Le categorie di Revit possono avere conteggi differenti per via di esportazione, fasi, opzioni e mapping IFC. Annotare una differenza è un risultato didattico, non necessariamente un errore.","en":"The IFC4X3_ADD2 reference contains 30 `IfcWall`, 15 `IfcDoor`, and 7 `IfcWindow`. Revit category counts may differ due to export scope, phases, design options and IFC mapping. Documenting a difference is a learning outcome, not necessarily a failure."}},{"title":{"it":"Caso applicativo","en":"Applied example"},"text":{"it":"Prompt: «Utilizza soltanto i Tools Revit disponibili in modalità Read. Conta Walls, Doors e Windows nel documento aperto, indica gli strumenti usati e segnala eventuali filtri o limiti. Non modificare nulla.»","en":"Prompt: “Use only available Read-mode Revit tools. Count Walls, Doors and Windows in the open document, list the tools used, and disclose filters or limitations. Do not modify anything.”"},"widget":"ifc"},{"title":{"it":"Esercitazione e verifica","en":"Practice and verify"},"text":{"it":"Confronta almeno un risultato con un abaco o una selezione verificabile in Revit. Registra la differenza rispetto allo snapshot IFC.\n\n**Controllo:** La verifica è guidata: nessun caricamento automatico di report al sito.","en":"Cross-check at least one result using a Revit schedule or verifiable selection. Record any differences relative to the IFC snapshot.\n\n**Check:** This is a guided check; no report upload to the website is required."}}]},{"id":"a7.2","title":{"it":"Categorie, tipi e livelli","en":"Categories, types and storeys"},"mins":15,"kind":"ifc","steps":[{"title":{"it":"Il concetto","en":"The concept"},"text":{"it":"Un oggetto BIM va interpretato considerando categoria, tipologia, istanza, livello e identificativi. Nell’IFC fornito sono presenti sei `IfcBuildingStorey` chiamati `A_S_0`, `A_A_0`, `A_S_1`, `A_A_1`, `A_S_2` e `A_A_2`. Non ogni riferimento a un livello IFC deve coincidere con il nome di una vista Revit.","en":"A BIM object must be interpreted through category, type, instance, level and identifiers. The supplied IFC contains six `IfcBuildingStorey` entities named `A_S_0`, `A_A_0`, `A_S_1`, `A_A_1`, `A_S_2`, and `A_A_2`. An IFC storey reference does not necessarily match a Revit view name."}},{"title":{"it":"Come funziona","en":"How it works"},"text":{"it":"Parti da un sottoinsieme, ad esempio le porte, e limita la richiesta a un livello. Chiedi al modello di indicare esattamente il criterio di filtro, non soltanto una tabella finale. Controlla poi uno o due ElementId/UniqueId nel progetto.","en":"Start with a subset, such as doors, and filter by a level. Ask the model to disclose the exact filter criteria, not just the final table. Then cross-check one or two ElementId/UniqueIds in Revit."}},{"title":{"it":"Caso applicativo","en":"Applied example"},"text":{"it":"Prompt: «Elenca fino a 10 porte associate al livello scelto. Riporta identificativo, nome/tipo e livello effettivamente recuperato. Se il Tool non può filtrare per livello, dichiaralo.»","en":"Prompt: “List up to ten doors associated with the selected level. Include identifier, name/type and actual retrieved level. If the tool cannot filter by level, say so.”"},"widget":"ifc"},{"title":{"it":"Esercitazione e verifica","en":"Practice and verify"},"text":{"it":"Apri manualmente gli elementi in Revit e verifica che livello e tipologia siano coerenti. Se un GUID è solo del file IFC, non spacciarlo per ElementId di Revit.\n\n**Controllo:** Il campo `GlobalId` IFC e `ElementId` Revit sono identificatori differenti.","en":"Open the elements in Revit and confirm level and type information. Do not present an IFC GUID as though it were a Revit ElementId.\n\n**Check:** IFC `GlobalId` and Revit `ElementId` are different identifier systems."}}]},{"id":"a7.3","title":{"it":"Parametri e quantità BIM","en":"BIM parameters and quantities"},"mins":20,"kind":"ifc","steps":[{"title":{"it":"Il concetto","en":"The concept"},"text":{"it":"Le proprietà BIM possono essere di istanza o di tipo, interne a Revit o esportate come pset IFC. Non assumere che un parametro esposto in Revit compaia automaticamente nell’IFC, né che le unità numeriche coincidano senza conversione. Nel file IFC sono presenti attributi `ThermalTransmittance` e `FireRating` in alcune proprietà.","en":"BIM properties can be instance- or type-level, native to Revit or exported as IFC psets. A parameter present in Revit is not automatically present in IFC, and numeric units must not be assumed identical. The IFC file includes `ThermalTransmittance` and `FireRating` properties for some objects."}},{"title":{"it":"Come funziona","en":"How it works"},"text":{"it":"Il server Read potrebbe permettere di leggere parametri singoli o elenchi di parametri, in base al catalogo reale dei Tools. Per ogni valore registra identificativo, nome del parametro, contenuto, unità e origine. Gestisci con cura i valori nulli e non applicabili.","en":"The Read server may allow retrieval of individual or multiple parameters depending on the actual tool catalogue. For each value record the identifier, parameter name, value, unit and origin. Handle null and not-applicable values carefully."}},{"title":{"it":"Caso applicativo","en":"Applied example"},"text":{"it":"Prompt: «Per cinque pareti, elenca i parametri disponibili relativi ad area, volume e trasmittanza. Distingui tipo e istanza, non calcolare quantità assenti e segnala le unità.»","en":"Prompt: “For five walls, list available parameters related to area, volume and thermal transmittance. Distinguish type and instance, do not invent missing quantities, and report units.”"},"widget":"ifc"},{"title":{"it":"Esercitazione e verifica","en":"Practice and verify"},"text":{"it":"Scegli una parete e confronta le proprietà con l’interfaccia Revit. Se l’IFC non ha quantità `IfcQuantityArea`/`IfcQuantityVolume`, non presentarle come già esportate.\n\n**Controllo:** In questo IFC non risultano entità `IfcQuantityArea` né `IfcQuantityVolume`; il risultato del laboratorio deve basarsi su Revit e sui Tools effettivamente disponibili.","en":"Select one wall and compare properties with Revit. If the IFC lacks `IfcQuantityArea`/`IfcQuantityVolume`, do not claim they were exported.\n\n**Check:** This IFC contains no `IfcQuantityArea` or `IfcQuantityVolume` entities; the lab must use live Revit data and actual available tools."}}]},{"id":"a7.4","title":{"it":"Verifiche informative","en":"Information completeness checks"},"mins":20,"kind":"ifc","steps":[{"title":{"it":"Il concetto","en":"The concept"},"text":{"it":"Una verifica informativa deve definire il requisito prima di interrogare il modello. Un valore vuoto non equivale a un parametro inesistente; un valore di tipo può essere applicabile a molte istanze. Occorre quindi specificare categoria, ambito, parametro e regole per i valori nulli.","en":"An information completeness check must define the requirement before querying the model. An empty value is not the same as a missing parameter; a type-level value can apply to many instances. Define category, scope, parameter and treatment of nulls."}},{"title":{"it":"Come funziona","en":"How it works"},"text":{"it":"Nel caso studio, il file IFC mostra alcune proprietà `FireRating` e `ThermalTransmittance`, ma la loro presenza non implica completezza per tutti gli oggetti. Gli strumenti potrebbero non esporre direttamente query complesse: in tal caso occorre recuperare un insieme e analizzarlo in modo dichiarato.","en":"The IFC snapshot contains some `FireRating` and `ThermalTransmittance` properties, but their presence does not prove completeness across all objects. The server might not expose complex filters directly: if so, retrieve a subset and analyse it transparently."}},{"title":{"it":"Caso applicativo","en":"Applied example"},"text":{"it":"Prompt: «Verifica quali porte non hanno un valore Fire Rating utilizzabile. Distingui valore mancante, campo vuoto e parametro non esposto dal Tool. Elenca gli identificativi senza modificare il modello.»","en":"Prompt: “Check which doors lack a usable Fire Rating value. Distinguish missing value, empty field and parameter not exposed by the tool. List identifiers without changing the model.”"},"widget":"ifc"},{"title":{"it":"Esercitazione e verifica","en":"Practice and verify"},"text":{"it":"Verifica manualmente almeno due porte, specificando se il parametro è di tipo o di istanza.\n\n**Controllo:** Una conclusione «tutte le porte conformi» richiederebbe prima la formalizzazione di un requisito, non soltanto la presenza della proprietà.","en":"Manually check at least two doors and document whether the parameter is type- or instance-based.\n\n**Check:** Claiming “all doors comply” requires a defined requirement, not merely a populated property."}}]},{"id":"a7.5","title":{"it":"Report BIM verificabili","en":"Verifiable BIM reports"},"mins":25,"kind":"ifc","steps":[{"title":{"it":"Il concetto","en":"The concept"},"text":{"it":"Un report prodotto con un LLM è utile quando collega ogni valore a una fonte identificabile. Usa la stessa copia del modello e uno schema tabellare fisso: categoria, numero di istanze, criteri di filtro, identificativi campionati, Tool usato e limitazioni. Il report non deve assumere che tutte le quantità siano affidabili.","en":"An LLM-generated report is useful when every value has a traceable source. Use the same model copy and a fixed table schema: category, instance count, filter criteria, sampled IDs, tool used and limitations. Do not assume all quantities are trustworthy."}},{"title":{"it":"Come funziona","en":"How it works"},"text":{"it":"Lo snapshot IFC di riferimento include anche 11 `IfcSlab`, 21 `IfcColumn`, 14 `IfcBeam`, 2 `IfcRoof` e 13 `IfcSpace`. Usa tali conteggi solo per una seconda colonna di confronto IFC, mai come risultato fittizio di una chiamata Revit.","en":"The IFC snapshot also contains 11 `IfcSlab`, 21 `IfcColumn`, 14 `IfcBeam`, 2 `IfcRoof` and 13 `IfcSpace`. Use these counts only as a separate IFC reference column, never as invented live Revit results."}},{"title":{"it":"Caso applicativo","en":"Applied example"},"text":{"it":"Prompt: «Produci un report su Walls, Doors, Windows, Slabs, Columns e Beams. Se un numero non è verificabile con i Tools disponibili, scrivi non disponibile. Elenca strumenti e criteri.»","en":"Prompt: “Produce a report for Walls, Doors, Windows, Slabs, Columns and Beams. If a figure cannot be verified with available tools, state unavailable. List tools and criteria.”"},"widget":"ifc"},{"title":{"it":"Esercitazione e verifica","en":"Practice and verify"},"text":{"it":"Salva il report e verifica manualmente almeno tre righe o tre identificativi. Aggiungi una nota che distingua l’IFC snapshot dal modello attualmente aperto.\n\n**Controllo:** Un report replicabile include data, versione software e contesto del documento.","en":"Save the report and manually verify at least three rows or three IDs. Add a note distinguishing the IFC snapshot from the currently open model.\n\n**Check:** A reproducible report includes date, software version and document context."}}]}],"quiz":[{"q":{"it":"Quante entità IfcWall contiene lo snapshot IFC del corso?","en":"How many IfcWall entities are in the course IFC snapshot?"},"opts":{"it":["30","15","7"],"en":["30","15","7"]},"correct":0,"why":{"it":"Conteggio delle istanze `IfcWall` nell’IFC allegato.","en":"Count of `IfcWall` instances in the supplied IFC."}},{"q":{"it":"GlobalId IFC ed ElementId Revit...","en":"IFC GlobalId and Revit ElementId..."},"opts":{"it":["sono sempre identici","sono identificativi diversi","sono unità di misura"],"en":["are always identical","are different identifiers","are units of measure"]},"correct":1,"why":{"it":"Usano sistemi distinti; la corrispondenza va verificata.","en":"They use distinct systems; mappings must be verified."}},{"q":{"it":"Un valore FireRating vuoto equivale a parametro inesistente?","en":"Is an empty FireRating equal to a missing parameter?"},"opts":{"it":["Sì","Solo con IFC4x3","No"],"en":["Yes","Only in IFC4x3","No"]},"correct":2,"why":{"it":"Distinguere valore assente e proprietà non definita.","en":"Distinguish missing values from undefined properties."}},{"q":{"it":"Quale controllo rende verificabile un report AI?","en":"What makes an AI report verifiable?"},"opts":{"it":["Tool, filtri e campioni verificati","Solo testo elegante","Nessuna informazione aggiuntiva"],"en":["Tools, filters and verified samples","Elegant prose alone","No additional information"]},"correct":0,"why":{"it":"La tracciabilità permette un controllo indipendente.","en":"Traceability supports independent validation."}},{"q":{"it":"Se il Tool non espone una quantità...","en":"If the tool does not expose a quantity..."},"opts":{"it":["inventala dai colori","segnala la limitazione","cambiala senza permesso"],"en":["invent it from colours","report the limitation","change it without approval"]},"correct":1,"why":{"it":"Non fabbricare numeri per completare il report.","en":"Never fabricate values to fill the report."}}]},{"id":"m8","title":{"it":"Sviluppare MCP personalizzati","en":"Developing custom MCP servers"},"subtitle":{"it":"Python SDK, Inspector e architettura C#/Revit API","en":"Python SDK, Inspector and C#/Revit API architecture"},"mins":70,"lessons":[{"id":"a8.1","title":{"it":"Progettare un Tool BIM","en":"Design a BIM tool"},"mins":10,"kind":"theory","steps":[{"title":{"it":"Il concetto","en":"The concept"},"text":{"it":"Il primo passo nello sviluppo non è scrivere codice ma definire uno scopo verificabile, input, output ed errori. Un Tool come `get_model_info` dovrebbe dichiarare origine dei dati, campi restituiti, condizioni di errore e semantica delle unità. Evita Tool generici che permettono di eseguire codice arbitrario sul modello.","en":"The first development step is not coding but specifying verifiable purpose, inputs, outputs and errors. A tool such as `get_model_info` should document the data source, output fields, failure modes and units. Avoid generic tools that allow arbitrary code execution against the model."}},{"title":{"it":"Come funziona","en":"How it works"},"text":{"it":"In un progetto BIM è utile distinguere l’identità della sessione (file/documento attivo), l’identità degli oggetti (ID/GUID) e lo schema dei dati. Questa separazione riduce il rischio di modifiche accidentali e risultati ambigui.","en":"In a BIM project, distinguish session identity (current file/document), object identity (ID/GUID) and data schema. Keeping these separate reduces accidental modifications and ambiguous results."}},{"title":{"it":"Caso applicativo","en":"Applied example"},"text":{"it":"Progetta un Tool Read che restituisca `{category, count, source}` per un IFC snapshot, specificando esplicitamente che non interroga Revit.","en":"Design a Read tool returning `{category, count, source}` for an IFC snapshot, explicitly stating that it does not query Revit."}},{"title":{"it":"Esercitazione e verifica","en":"Practice and verify"},"text":{"it":"Definisci almeno un caso di successo e uno di errore: per esempio categoria non supportata.\n\n**Controllo:** Non confondere demo offline e integrazione Autodesk.","en":"Define at least one success and one error case, such as unsupported category.\n\n**Check:** Do not confuse an offline demo with Autodesk integration."}}]},{"id":"a8.2","title":{"it":"Server Python con MCP SDK v2","en":"Python server using MCP SDK v2"},"mins":20,"kind":"ifc","steps":[{"title":{"it":"Il concetto","en":"The concept"},"text":{"it":"L’SDK Python MCP v2 espone la classe `MCPServer` e decoratori per Tools, Resources e Prompts. Una funzione è richiamabile tramite il protocollo se è stata registrata ed eseguita dentro il server. Per ambienti didattici conviene partire con dati statici e poi sostituire la sorgente.","en":"The MCP Python SDK v2 exposes `MCPServer` and decorators for tools, resources and prompts. A function is callable through the protocol once registered and run by the server. For learning, start with static data before swapping in a real data source."}},{"title":{"it":"Come funziona","en":"How it works"},"text":{"it":"Installa `mcp[cli]` tramite uv, crea il file e usa `mcp.run(transport=\"stdio\")` come entrypoint. La funzione demo usa conteggi estratti dall’IFC, validando la categoria richiesta. Non scrivere log su stdout.","en":"Install `mcp[cli]` using uv, create the file and use `mcp.run(transport=\"stdio\")` as an entrypoint. The demo function uses counts observed in IFC and validates the requested category. Avoid stdout logging."},"code":"from mcp.server import MCPServer\nmcp = MCPServer(\"MCP Academy BIM\")\n\n@mcp.tool()\ndef get_course_model_counts(category: str) -> dict:\n    \"\"\"Read the STATIC IFC course snapshot; does not query Revit.\"\"\"\n    counts = {\"IfcWall\":30,\"IfcDoor\":15,\"IfcWindow\":7,\"IfcSlab\":11}\n    if category not in counts:\n        return {\"error\": \"unsupported_category\", \"category\": category}\n    return {\"category\":category,\"count\":counts[category],\"source\":\"IFC snapshot\"}\n\nif __name__ == \"__main__\":\n    mcp.run(transport=\"stdio\")"},{"title":{"it":"Caso applicativo","en":"Applied example"},"text":{"it":"Il codice di esempio nel pacchetto fornisce `get_course_model_counts` e `get_course_model_info`, così puoi controllare anche l’origine dei numeri e lo schema IFC4X3_ADD2.","en":"The downloadable example offers `get_course_model_counts` and `get_course_model_info`, so you can inspect the source of numbers and the IFC4X3_ADD2 schema."},"widget":"ifc"},{"title":{"it":"Esercitazione e verifica","en":"Practice and verify"},"text":{"it":"Rendi eseguibile il server e aggiungi una categoria supportata dello snapshot, per esempio `IfcSlab` con 11 elementi.\n\n**Controllo:** Non cambiare il dato senza una nuova verifica: un numero dimostrativo non è un conteggio generato dal client AI.","en":"Run the server and add another supported snapshot category, such as `IfcSlab` with 11 elements.\n\n**Check:** Do not change the figure without verifying it: a demo number is not an AI-generated count."}}]},{"id":"a8.3","title":{"it":"Test indipendenti con Inspector","en":"Independent testing with Inspector"},"mins":15,"kind":"theory","steps":[{"title":{"it":"Il concetto","en":"The concept"},"text":{"it":"Prima di collegare un LLM devi sapere se il tuo Tool funziona da solo. L’Inspector consente di ispezionare il catalogo, passare argomenti e registrare risposte. La validazione del codice Python può essere affiancata da unit test locali.","en":"Before connecting an LLM, verify the tool works on its own. Inspector exposes the catalogue, lets you pass arguments and record responses. Python logic validation can be supplemented by local unit tests."}},{"title":{"it":"Come funziona","en":"How it works"},"text":{"it":"Testa casi positivi, categorie non supportate e condizioni anomale. Ogni test dovrebbe avere input, output atteso e controllo esplicito. La risposta corretta del Tool non garantisce automaticamente che il modello AI la riassuma bene.","en":"Test successful requests, unsupported categories and unexpected conditions. Every test should identify input, expected output and validation. Correct tool output does not automatically guarantee an accurate AI summary."},"code":"uv run mcp dev server.py"},{"title":{"it":"Caso applicativo","en":"Applied example"},"text":{"it":"Testa `IfcWall`, poi `UnknownCategory` e confronta struttura e significato dei risultati. Verifica l’assenza di scritture sul modello.","en":"Test `IfcWall` and then `UnknownCategory`; compare response structures and meanings. Confirm that no writes occur."}},{"title":{"it":"Esercitazione e verifica","en":"Practice and verify"},"text":{"it":"Registra input e output in una checklist e correggi eventuali errori prima di passare al collegamento AI.\n\n**Controllo:** Una categoria non supportata va documentata come tale; non sempre il conteggio zero è la scelta migliore.","en":"Record inputs and outputs in a checklist and fix issues before connecting an AI client.\n\n**Check:** An unsupported category should be reported as such; returning zero is not always ideal."}}]},{"id":"a8.4","title":{"it":"Collegamento al client AI","en":"Connect to an AI client"},"mins":10,"kind":"theory","steps":[{"title":{"it":"Il concetto","en":"The concept"},"text":{"it":"Per un server locale STDIO, un client compatibile deve conoscere l’interprete/command, il percorso dello script e gli argomenti di avvio. Claude Desktop utilizza `claude_desktop_config.json`; nel file non inserire token né credenziali nel repository.","en":"For a local STDIO server, a compatible client needs the command/interpreter, script path and startup arguments. Claude Desktop uses `claude_desktop_config.json`; do not commit tokens or credentials to your repository."}},{"title":{"it":"Come funziona","en":"How it works"},"text":{"it":"Usa l’interprete Python dell’ambiente virtuale in modo che trovi il pacchetto `mcp`. Se il piano AI gratuito è limitato o temporaneamente esaurito, verifica comunque il server con Inspector, senza acquistare crediti API.","en":"Use the virtual environment interpreter so the `mcp` dependency is found. If free AI usage is limited or exhausted, keep testing with Inspector rather than buying API credits."},"code":"{\n  \"mcpServers\": {\n    \"bim-academy\": {\n      \"command\": \"C:\\\\PATH\\\\mcp-lab\\\\.venv\\\\Scripts\\\\python.exe\",\n      \"args\": [\"C:\\\\PATH\\\\mcp-lab\\\\server.py\"]\n    }\n  }\n}"},{"title":{"it":"Caso applicativo","en":"Applied example"},"text":{"it":"Chiedi all’AI di elencare i Tools del server didattico e poi di chiamare `get_course_model_counts` sulla categoria `IfcDoor`, segnalando la fonte statica.","en":"Ask the AI to list the demo server tools and then call `get_course_model_counts` for `IfcDoor`, disclosing the static source."}},{"title":{"it":"Esercitazione e verifica","en":"Practice and verify"},"text":{"it":"Confronta l’output di Claude con Inspector. La conversazione non deve attribuire al modello aperto in Revit i dati dello snapshot.\n\n**Controllo:** Se il client non è disponibile gratuitamente, il laboratorio resta verificabile tramite Inspector.","en":"Compare Claude’s answer with Inspector. The chat must not attribute the snapshot data to a live open Revit model.\n\n**Check:** If the client is not available for free, the lab remains verifiable through Inspector."}}]},{"id":"a8.5","title":{"it":"Architettura Revit API e C#","en":"Revit API and C# architecture"},"mins":15,"kind":"flow","steps":[{"title":{"it":"Il concetto","en":"The concept"},"text":{"it":"Una chiamata proveniente da un processo MCP non può invocare arbitrariamente le API di Revit da un thread esterno. Un possibile progetto usa un add-in C# che riceve richieste tramite un bridge locale e ne pianifica l’esecuzione nel contesto autorizzato tramite `ExternalEvent`.","en":"A request arriving at an MCP process cannot call the Revit API arbitrarily from an external thread. One architecture uses a C# add-in that receives messages from a local bridge and schedules them on an authorised context using `ExternalEvent`."}},{"title":{"it":"Come funziona","en":"How it works"},"text":{"it":"Per Revit 2027 Autodesk indica .NET 10 per lo sviluppo add-in. Occorrono quindi progetto C#, riferimenti alle API Revit, manifest `.addin`, gestione del ciclo di vita e comunicazione con Python. È una parte sostanzialmente più complessa del Tool statico.","en":"For Revit 2027 Autodesk specifies .NET 10 for add-ins. You need a C# project, Revit API references, a `.addin` manifest, lifecycle handling and Python communication. This is substantially more complex than a static-data tool."}},{"title":{"it":"Caso applicativo","en":"Applied example"},"text":{"it":"Il Developer Lab facoltativo fornisce un progetto iniziale: backend Python, add-in C#, bridge locale e check end-to-end. Il suo codice non va trattato come collaudato su Revit finché non viene compilato ed eseguito su una macchina Windows idonea.","en":"The optional Developer Lab provides a starter: Python backend, C# add-in, local bridge and end-to-end checks. Its code must not be treated as validated on Revit until built and run on a suitable Windows machine."},"widget":"flow"},{"title":{"it":"Esercitazione e verifica","en":"Practice and verify"},"text":{"it":"Disegna il confine tra processo Python, listener, `ExternalEvent.Execute` e Revit Document. Individua dove vanno validati gli argomenti.\n\n**Controllo:** Validazione prima del bridge e nel contesto Revit: mai fidarsi degli input solo perché arrivano da un client MCP.","en":"Draw the boundary between Python process, listener, `ExternalEvent.Execute` and the Revit Document. Identify where arguments should be validated.\n\n**Check:** Validate both before the bridge and in the Revit context: never blindly trust input because it came from an MCP client."}}]}],"quiz":[{"q":{"it":"Quale SDK Python è presentato nel corso?","en":"Which Python SDK is used in the course?"},"opts":{"it":["MCP SDK v2","IfcOpenShell obbligatorio","Dynamo soltanto"],"en":["MCP SDK v2","Mandatory IfcOpenShell","Dynamo only"]},"correct":0,"why":{"it":"Il codice usa `MCPServer` dello SDK v2.","en":"The examples use `MCPServer` from SDK v2."}},{"q":{"it":"Il server demo legge il modello RVT aperto?","en":"Does the demo server query the open RVT?"},"opts":{"it":["Sì","No, legge uno snapshot statico","Solo se Claude Pro"],"en":["Yes","No, it reads a static snapshot","Only with Claude Pro"]},"correct":1,"why":{"it":"Il dato statico viene da un’analisi dell’IFC di riferimento.","en":"The static numbers derive from analysis of the supplied IFC."}},{"q":{"it":"Quale classe Revit aiuta a gestire chiamate esterne nel contesto API?","en":"Which Revit mechanism can marshal requests into an API context?"},"opts":{"it":["ExternalEvent","IfcQuantityArea","JSON.stringify"],"en":["ExternalEvent","IfcQuantityArea","JSON.stringify"]},"correct":0,"why":{"it":"ExternalEvent permette di programmare operazioni in un contesto Revit previsto.","en":"ExternalEvent schedules operations in an appropriate Revit context."}},{"q":{"it":"Qual è il framework .NET per add-in Revit 2027?","en":"What .NET target is specified for Revit 2027 add-ins?"},"opts":{"it":[".NET Framework 4.8",".NET 10",".NET 5"],"en":[".NET Framework 4.8",".NET 10",".NET 5"]},"correct":1,"why":{"it":"Autodesk ha aggiornato Revit 2027 a .NET 10.","en":"Autodesk migrated Revit 2027 to .NET 10."}},{"q":{"it":"Un server MCP Python deve stampare debug su stdout quando usa STDIO?","en":"Should a Python MCP STDIO server print debug messages to stdout?"},"opts":{"it":["Sì","Non importa","No"],"en":["Yes","It does not matter","No"]},"correct":2,"why":{"it":"stdout è usato dal trasporto MCP.","en":"stdout carries MCP transport messages."}}]}],"optionalLabs":[{"id":"write","title":{"it":"Write Lab — Modifica controllata","en":"Write Lab — Controlled editing"},"mins":25,"it":"Facoltativo. Crea una copia del progetto, attiva solo i Tools Write disponibili e individua una proprietà scrivibile non critica su un singolo elemento. Prima di procedere chiedi al client di mostrare Tool, elemento, parametro, vecchio e nuovo valore. Approva soltanto una modifica verificabile, confronta in Revit e usa Undo se serve. I nomi dei Tools dipendono dalla tua build.","en":"Optional. Copy the project, enable only available Write tools and choose a non-critical writable property on one element. First ask the client to show the tool, element, parameter, old and proposed values. Approve only a verifiable change, cross-check in Revit and use Undo if needed. Exact tools depend on your build."},{"id":"developer","title":{"it":"Developer Lab — Custom Revit MCP","en":"Developer Lab — Custom Revit MCP"},"mins":150,"it":"Facoltativo, 2–3 ore aggiuntive. Usa lo Starter Project Python/C# per implementare un bridge locale read-only tra MCPServer e la Revit API, compilare un add-in .NET 10 e verificarne il funzionamento sul modello aperto. Il codice è uno starter didattico da collaudare in un ambiente Revit reale. Non distribuire il modello originale senza autorizzazione.","en":"Optional, an additional 2–3 hours. Use the Python/C# Starter Project to implement a local read-only bridge between MCPServer and the Revit API, build a .NET 10 add-in and test it on the open model. The source is a learning starter requiring real Revit validation. Do not redistribute the original model without permission."}],"model":{"schema":"IFC4X3_ADD2","origin":"Autodesk Revit 27.3.0.28 (IFC export metadata)","classes":{"IfcWall":30,"IfcDoor":15,"IfcWindow":7,"IfcSlab":11,"IfcColumn":21,"IfcBeam":14,"IfcRoof":2,"IfcSpace":13,"IfcBuildingStorey":6,"IfcStair":1,"IfcRailing":5},"levels":["A_S_0","A_A_0","A_S_1","A_A_1","A_S_2","A_A_2"],"spaces":["Kitchen","Garage","Living Room","Bathroom","Single Bedroom","Boiler rooom","Master Bedroom","Corridor","Storage room","Anteroom","Attic"],"quantityNotes":{"it":"L’IFC non contiene IfcQuantityArea/IfcQuantityVolume; non confondere le quantità Revit con QTO IFC esportate.","en":"The IFC contains no IfcQuantityArea/IfcQuantityVolume; do not confuse live Revit quantities with exported IFC QTO."}},"sources":[{"title":"Model Context Protocol — specification 2026-07-28","url":"https://modelcontextprotocol.io/specification/2026-07-28"},{"title":"Autodesk — Revit Public MCP Server","url":"https://help.autodesk.com/view/ADSKMCP/ENU/?guid=ADSKMCP_RevitMcp_revit_mcp_server_html"},{"title":"Autodesk — Setting Up Revit MCP","url":"https://help.autodesk.com/view/ADSKMCP/ENU/?guid=ADSKMCP_RevitMcp_setting_up_revit_mcp_server_html"},{"title":"Official MCP Python SDK v2","url":"https://py.sdk.modelcontextprotocol.io/"},{"title":"Autodesk — Revit 2027 .NET 10","url":"https://help.autodesk.com/cloudhelp/2027/ITA/Revit-WhatsNew/files/GUID-8D7A4715-EAF8-4BD1-BE78-061F900D0BCE.htm"},{"title":"Autodesk — Revit API External Events","url":"https://help.autodesk.com/cloudhelp/2026/ENU/Revit-API/files/Revit_API_Developers_Guide/Advanced_Topics/Revit_API_Revit_API_Developers_Guide_Advanced_Topics_External_Events_html.html"}]};

/* Shared Academy progress overview; independent track state, no external requests. */
window.MCPAcademyProgress = (() => {
  'use strict';
  const ESSENTIALS_KEY = 'mcp-academy-progress-v1';
  const ADVANCED_KEY = 'mcp-academy-advanced-v2';
  const ESSENTIALS_LESSONS = ['e1','e2','e3','e4','e5'];
  const ADVANCED_MODULES = [{"id":"m1","title":{"it":"Fondamenti MCP","en":"MCP foundations"},"lessons":["a1.1","a1.2","a1.3"]},{"id":"m2","title":{"it":"Architettura MCP","en":"MCP architecture"},"lessons":["a2.1","a2.2","a2.3"]},{"id":"m3","title":{"it":"Tools, Resources e Prompts","en":"Tools, Resources and Prompts"},"lessons":["a3.1","a3.2","a3.3"]},{"id":"m4","title":{"it":"Primo server MCP","en":"Your first MCP server"},"lessons":["a4.1","a4.2","a4.3"]},{"id":"m5","title":{"it":"MCP per Autodesk Revit","en":"MCP for Autodesk Revit"},"lessons":["a5.1","a5.2","a5.3"]},{"id":"m6","title":{"it":"Installazione e connessione a Revit","en":"Installing and connecting to Revit"},"lessons":["a6.1","a6.2","a6.3"]},{"id":"m7","title":{"it":"Laboratori BIM sul modello comune","en":"BIM labs using the shared model"},"lessons":["a7.1","a7.2","a7.3","a7.4","a7.5"]},{"id":"m8","title":{"it":"Sviluppare MCP personalizzati","en":"Developing custom MCP servers"},"lessons":["a8.1","a8.2","a8.3","a8.4","a8.5"]}];
  const ADVANCED_IDS = ADVANCED_MODULES.flatMap(module => module.lessons);
  function read(key) {
    try { const value = JSON.parse(localStorage.getItem(key) || 'null');
      return value && typeof value === 'object' ? value : {};
    } catch (_) { return {}; }
  }
  function validCompleted(value, ids) {
    if (!Array.isArray(value)) return [];
    const valid = new Set(ids);
    return [...new Set(value.filter(id => typeof id === 'string' && valid.has(id)))];
  }
  function snapshot() {
    const e = read(ESSENTIALS_KEY);
    const a = read(ADVANCED_KEY);
    const essentials = validCompleted(e.completed, ESSENTIALS_LESSONS);
    // Optional labs are deliberately excluded: only module lessons count.
    const advanced = validCompleted(a.completed, ADVANCED_IDS);
    const quizzes = a.quizzes && typeof a.quizzes === 'object' ? a.quizzes : {};
    return {
      essentials: {
        completed: essentials.length, total: ESSENTIALS_LESSONS.length,
        percent: Math.round(essentials.length / ESSENTIALS_LESSONS.length * 100),
        best: Number.isFinite(Number(e.best)) ? Math.min(100,Math.max(0,Number(e.best))) : 0,
        lessonIds: essentials
      },
      advanced: {
        completed: advanced.length, total: ADVANCED_IDS.length,
        percent: Math.round(advanced.length / ADVANCED_IDS.length * 100),
        lessonIds: advanced,
        passed: ADVANCED_MODULES.filter(m => Number(quizzes[m.id]) >= 80).length,
        totalQuizzes: ADVANCED_MODULES.length,
        modules: ADVANCED_MODULES.map(m => ({
          id: m.id, title: m.title,
          completed: m.lessons.filter(id => advanced.includes(id)).length,
          total: m.lessons.length
        }))
      }
    };
  }
  function cards(language = 'it') {
    const it = language !== 'en';
    const all = snapshot();
    const entries = [
      {id:'essentials', name:'Essentials', number:'01', href:'./index.html', info: it?'Quiz finale migliore':'Best final quiz', extra: all.essentials.best + '%', course:all.essentials},
      {id:'advanced', name:'Advanced', number:'02', href:'./advanced.html', info: it?'Quiz dei moduli superati':'Module quizzes passed', extra:all.advanced.passed + '/' + all.advanced.totalQuizzes, course:all.advanced}
    ];
    return '<section class="academy-progress-grid" aria-label="' + (it?'Progressi dei percorsi':'Course progress') + '">' + entries.map(entry =>

lass="right-controls">${last&&!finished?`<button class="btn btn-soft" data-action="finish" ${!canFinish?'disabled':''}>${t('finish')} ${icon('check',17)}</button>`:''}${!last||lessonIndex<D.lessons.length-1?`<button class="btn btn-primary" data-action="next">${last?t('nextLesson'):t('next')} ${icon('arrow',18)}</button>`:''}</div></div>${last&&!canFinish?`<p class="finish-note">${t('passFirst')}</p>`:''}</div><div class="reader-outro">${t('version')} · <button data-action="sources">${t('sources')} ↗</button></div></section></div></main>`}

  const EKEY = 'mcp-academy-progress-v1';
  const AKEY = 'mcp-academy-advanced-v2';
  const essentials = typeof ACADEMY_DATA !== 'undefined' ? ACADEMY_DATA : null;
  const advanced = window.MCP_ADVANCED_DATA || null;
  if (!essentials || !advanced || !window.MCPAcademyProgress) {
    console.warn('MCP Academy: global tools require both course data sets.');
    return;
  }
  const currentTrack = document.getElementById('adv-root') ? 'advanced' : 'essentials';
  const ADVANCED_GLOSSARY = [
    ['MCP','Protocollo che collega applicazioni AI a Tools, Resources e Prompts.','Protocol connecting AI applications to tools, resources and prompts.'],
    ['Host','Applicazione che gestisce l’esperienza AI e i collegamenti MCP.','Application managing the AI experience and MCP connections.'],
    ['Client','Componente che comunica con un server MCP.','Component that communicates with an MCP server.'],
    ['Server','Programma che espone strumenti e dati mediante MCP.','Program exposing tools and data through MCP.'],
    ['STDIO','Trasporto MCP tramite input/output standard del processo.','MCP transport over a process standard input/output.'],
    ['Streamable HTTP','Trasporto MCP su endpoint HTTP.','MCP transport over HTTP endpoints.'],
    ['Tool','Operazione richiamabile tramite nome e argomenti.','Callable operation with a name and arguments.'],
    ['Resource','Contenuto consultabile identificato da URI.','Readable content addressed by a URI.'],
    ['Prompt','Template di istruzioni riutilizzabile.','Reusable instruction template.'],
    ['IfcWall','Entità IFC che rappresenta una parete.','IFC entity representing a wall.'],
    ['ExternalEvent','Meccanismo della Revit API per eseguire operazioni dal contesto appropriato.','Revit API mechanism to execute operations within an appropriate context.'],
    ['JSON-RPC','Formato strutturato per messaggi di richiesta e risposta.','Structured request/response message format.']
  ];
  const entries = new Map();
  for (const term of essentials.glossary) entries.set(term.term.toLocaleLowerCase(), { ...term });
  for (const [term,it,en] of ADVANCED_GLOSSARY) {
    if (!entries.has(term.toLocaleLowerCase())) entries.set(term.toLocaleLowerCase(),{term,it,en});
  }
  const glossary = [...entries.values()].sort((a,b)=>a.term.localeCompare(b.term));
  const allAdvanced = advanced.modules.flatMap(m => m.lessons);
  const allEssential = essentials.lessons;
  const validIds = {
    essentials: new Set(allEssential.map(l=>l.id)),
    advanced: new Set(allAdvanced.map(l=>l.id))
  };
  const state = { view:null, tab:currentTrack, search:'', term:'', scroll:0, notice:'' };
  const esc = value => String(value ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const language = () => {
    try {
      const key = currentTrack === 'advanced' ? AKEY : EKEY;
      const item = JSON.parse(localStorage.getItem(key) || 'null');
      if (item && ['it','en'].includes(item.lang)) return item.lang;
    } catch (_) {}
    return document.documentElement.lang === 'en' ? 'en' : 'it';
  };
  const tr = (it,en) => language()==='it' ? it : en;
  const loc = x => typeof x === 'string' ? x : x?.[language()] || '';
  const read = key => {try {const x=JSON.parse(localStorage.getItem(key)||'null');return x && typeof x==='object'?x:{};}catch(_){return {};}};
  const icon = name => {
    const a = name==='search' ? '<circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/>' : name==='close' ? '<path d="M5 5l14 14M19 5 5 19"/>' : name==='back' ? '<path d="m19 12-14 0m6 6-6-6 6-6"/>' : '<path d="m5 12 14 0m-6-6 6 6-6 6"/>';
    return `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${a}</svg>`;
  };
  function baseSearch() {
    const records=[];
    for (const l of essentials.lessons) {
      for (let i=0;i<l.steps.length;i++) {
        const s=l.steps[i];const text=s.blocks[language()].filter(b=>b.type==='p'||b.type==='note'||b.type==='bullets').flatMap(b=>b.text?[b.text]:b.items||[]).join(' ');
        records.push({course:'essentials',lesson:l.id,step:i,module:tr('MCP Essentials','MCP Essentials'),title:loc(l.title),stepTitle:loc(s.title),description:text});
      }
    }
    for (const m of advanced.modules)for(const l of m.lessons)for(let i=0;i<l.steps.length;i++){
      const s=l.steps[i];records.push({course:'advanced',lesson:l.id,step:i,module:loc(m.title),title:loc(l.title),stepTitle:loc(s.title),description:loc(s.text)});
    }
    for(const lab of advanced.optionalLabs||[]){
      records.push({course:'advanced',optional:lab.id,lesson:lab.id,step:0,module:tr('Laboratorio facoltativo','Optional lab'),title:loc(lab.title),stepTitle:loc(lab.title),description:lab[language()]||''});
    }
    return records;
  }
  function resultHref(x) {
    const base=x.course==='advanced' ? './advanced.html' : './index.html';
    return x.optional ? `${base}?optional=${encodeURIComponent(x.optional)}` : `${base}?lesson=${encodeURIComponent(x.lesson)}&step=${x.step}`;
  }
  function searchResults() {
    const q=state.search.trim().toLocaleLowerCase();
    const grouped=new Map();
    for(const rec of baseSearch()) {
      const content=[rec.module,rec.title,rec.stepTitle,rec.description].join(' ').toLocaleLowerCase();
      if(!q || content.includes(q)){
        const key=rec.course+'-'+rec.lesson;
        if(!grouped.has(key) || q) {
          // With a query, the first matching step of a lesson is the destination.
          if (!grouped.has(key)) grouped.set(key,rec);
        }
      }
    }
    return [...grouped.values()];
  }
  function searchPage() {
    const results=searchResults();
    return `<main class="ag-utility-page ag-search-page"><button class="ag-back" data-academy="back">${icon('back')} ${tr('Torna alla pagina precedente','Back to previous page')}</button><div class="ag-utility-head"><span class="ag-overline">INDEX / SEARCH · MCP ACADEMY</span><h1>${tr('Cerca','Search')}</h1><p>${tr('Cerca in tutte le lezioni di Essentials e Advanced. Seleziona un risultato per aprire direttamente l’argomento.','Search every lesson in Essentials and Advanced. Select a result to open its topic directly.')}</p></div><label class="ag-search-wrap">${icon('search')}<input id="ag-search-field" type="search" autocomplete="off" placeholder="${tr('Cerca tra lezioni, moduli e argomenti…','Search lessons, modules and topics…')}" value="${esc(state.search)}" aria-label="${tr('Cerca in tutta l’Academy','Search the entire Academy')}"></label><p class="ag-result-count">${results.length} ${tr('risultati in entrambi i corsi','results across both courses')}</p><div class="ag-search-results">${results.length?results.map(x=>`<a class="ag-search-result" href="${resultHref(x)}"><div class="ag-result-meta"><span class="ag-course-chip">MCP ${x.course==='advanced'?'Advanced':'Essentials'}</span><span>${esc(x.module)}${x.optional?' · OPTIONAL':''}</span></div><strong>${esc(x.title)} / ${esc(x.stepTitle)}</strong><p>${esc(x.description.replace(/\*\*/g,'').slice(0,175))}${x.description.length>175?'…':''}</p><span class="ag-result-arrow">${icon('arrow')}</span></a>`).join(''):`<p class="ag-empty">${tr('Nessun contenuto corrispondente.','No matching content.')}</p>`}</div></main>`;
  }
  function glossaryModal() {
    const q=state.term.trim().toLocaleLowerCase();
    const matches=glossary.filter(x=>!q || (x.term+' '+x[language()]).toLocaleLowerCase().includes(q));
    return `<div class="ag-backdrop" id="ag-glossary-backdrop" data-academy="backdrop"><div class="ag-modal-panel" role="dialog" aria-modal="true" aria-labelledby="ag-glossary-title"><div class="ag-modal-head"><div><span class="ag-overline">REFERENCE · MCP ACADEMY</span><h2 id="ag-glossary-title">${tr('Glossario','Glossary')}</h2><p>${tr('Definizioni condivise di Essentials e Advanced, disponibili in entrambe le lingue.','Definitions from Essentials and Advanced in both languages.')}</p></div><button class="ag-modal-close" data-academy="close" aria-label="${tr('Chiudi il glossario','Close glossary')}">${icon('close')}</button></div><label class="ag-search-wrap">${icon('search')}<input id="ag-glossary-field" type="search" autocomplete="off" value="${esc(state.term)}" placeholder="${tr('Cerca un termine…','Search for a term…')}" aria-label="${tr('Cerca nel glossario','Search glossary')}"></label><div class="ag-glossary-list">${matches.length?matches.map(x=>`<div class="ag-term"><h3>${esc(x.term)}</h3><p>${esc(x[language()])}</p></div>`).join(''):`<p class="ag-empty">${tr('Nessun termine trovato.','No term found.')}</p>`}</div></div></div>`;
  }
  function tabs() {
    return `<div class="ag-tabs" role="tablist" aria-label="${tr('Percorsi formativi','Learning tracks')}">${['essentials','advanced'].map(c=>`<button id="ag-tab-${c}" role="tab" aria-selected="${state.tab===c}" tabindex="${state.tab===c?0:-1}" data-academy="tab" data-tab="${c}" aria-controls="ag-tabpanel"><span>MCP ${c==='essentials'?'Essentials':'Advanced'}</span></button>`).join('')}</div>`;
  }
  function progressDetail() {
    const snapshot=window.MCPAcademyProgress.snapshot();
    const e=read(EKEY),a=read(AKEY);
    const isAdvanced=state.tab==='advanced';
    const x=isAdvanced?snapshot.advanced:snapshot.essentials;
    const completed=new Set(x.lessonIds);
    const stats=isAdvanced?[
      [x.completed+'/'+x.total,tr('lezioni principali completate','core lessons completed')],
      [x.passed+'/'+x.totalQuizzes,tr('quiz superati','module quizzes passed')],
      [(Array.isArray(a.optional)?a.optional.filter(s=>advanced.optionalLabs.some(o=>o.id===s)):[]).length+'/'+advanced.optionalLabs.length,tr('laboratori facoltativi (separati)','optional labs (separate)')]
    ]:[
      [x.completed+'/'+x.total,tr('lezioni completate','lessons completed')],
      [x.best+'%',tr('miglior risultato del quiz finale','best final quiz score')],
      [x.best>=80?tr('Superato','Passed'):tr('Non superato','Not passed'),tr('quiz conclusivo (soglia 80%)','final quiz (80% to pass)')]
    ];
    const modules=isAdvanced?advanced.modules.map((m,i)=>{
      const done=m.lessons.filter(l=>completed.has(l.id)).length;
      const grade=Number(a.quizzes?.[m.id]||0);
      return `<a class="ag-progress-module" href="./advanced.html?module=${encodeURIComponent(m.id)}"><b>${esc(loc(m.title))} — ${Math.round(done/m.lessons.length*100)}%</b><small>${done}/${m.lessons.length} ${tr('lezioni','lessons')} · ${tr('Miglior quiz','Best quiz')}: ${grade}%</small></a>`;
    }).join(''):
      essentials.lessons.map((l,i)=>`<a class="ag-progress-module" href="./index.html?lesson=${encodeURIComponent(l.id)}&step=0"><b>${completed.has(l.id)?'✓ ':''}${esc(loc(l.title))}</b><small>${tr('Lezione','Lesson')} ${i+1} · ${completed.has(l.id)?tr('Completata','Completed'):tr('Non ancora completata','Not yet completed')}</small></a>`).join('');
    return `<div id="ag-tabpanel" role="tabpanel" aria-labelledby="ag-tab-${state.tab}"><h2 class="ag-detail-heading">${isAdvanced?tr('Dettaglio Advanced','Advanced details'):tr('Dettaglio Essentials','Essentials details')}</h2><div class="ag-progress-grid">${stats.map(([value,desc])=>`<div class="ag-progress-stat"><b>${esc(value)}</b><span>${esc(desc)}</span></div>`).join('')}</div><div class="ag-util-card"><h2>${tr('Backup dei progressi','Progress backup')} ${isAdvanced?'Advanced':'Essentials'}</h2><p class="ag-helper">${tr('I progressi dei due percorsi sono conservati separatamente nello stesso browser. Questi comandi agiscono soltanto su','Both tracks are stored separately in this browser. These controls affect only')} ${isAdvanced?'Advanced':'Essentials'}.</p><div class="ag-actions"><button data-academy="export" class="ag-button light">${tr('Esporta JSON','Export JSON')}</button><button data-academy="import" class="ag-button light">${tr('Importa JSON','Import JSON')}</button><button data-academy="reset" class="ag-button light">${tr('Azzera','Reset')} ${isAdvanced?'Advanced':'Essentials'}</button></div><input id="ag-import-input" type="file" accept=".json,application/json" hidden></div><div class="ag-util-card"><h2>${isAdvanced?tr('Moduli Advanced','Advanced modules'):tr('Lezioni Essentials','Essentials lessons')}</h2>${modules}</div></div>`;
  }
  function progressPage() {
    return `<main class="ag-advanced-utility"><button class="ag-back" data-academy="back">${icon('back')} ${tr('Torna alla pagina precedente','Back to previous page')}</button><span class="ag-overline">MY LEARNING</span><h1>${tr('Progressi Academy','Academy progress')}</h1><p class="ag-progress-intro">${tr('Le percentuali considerano le lezioni dei percorsi principali. I laboratori facoltativi non contano nel completamento di Advanced.','Percentages cover lessons in the core tracks. Optional labs do not count toward Advanced completion.')}</p>${tabs()}${progressDetail()}${state.notice?`<p class="ag-notice" role="status">${esc(state.notice)}</p>`:''}</main>`;
  }
  function removeSurface() {document.getElementById('academy-global-ui')?.remove();document.body.classList.remove('academy-global-page','academy-global-dialog');}
  function render(focusId=null) {
    if(!state.view)return;
    removeSurface();
    if(state.view==='glossary') document.body.classList.add('academy-global-dialog');
    else document.body.classList.add('academy-global-page');
    const el=document.createElement('div');el.id='academy-global-ui';
    el.innerHTML=state.view==='glossary'?glossaryModal():state.view==='search'?searchPage():progressPage();
    document.body.appendChild(el);
    if(focusId) {
      const input=document.getElementById(focusId);input?.focus();
      const caret= input?.value.length || 0;
      try {input?.setSelectionRange(caret,caret);}catch(_){}
    }
  }
  function open(view) {
    if(!state.view)state.scroll=window.scrollY;
    state.view=view;state.notice='';
    if(view==='search')state.search='';
    if(view==='glossary')state.term='';
    render(view==='glossary'?'ag-glossary-field':view==='search'?'ag-search-field':null);
    if(view!=='glossary')window.scrollTo(0,0);
  }
  function close() {
    if(!state.view)return;
    removeSurface();state.view=null;state.notice='';
    window.scrollTo(0,state.scroll);
  }
  function download(data,name) {
    const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
    const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500);
  }
  function exportState() {
    if(state.tab==='advanced') {
      const a=read(AKEY);download({format:'MCP_Academy_Advanced_Progress',schema:2,lang:a.lang||language(),lesson:a.lesson||'a1.1',step:a.step||0,completed:a.completed||[],quizzes:a.quizzes||{},checks:a.checks||{},optional:a.optional||[],view:'home'},'mcp-academy-advanced-progress.json');
    }else {
      const e=read(EKEY);download({format:'MCP_Academy_Progress',schema:1,lang:e.lang||language(),lessonId:e.lessonId||'e1',step:e.step||0,completed:e.completed||[],best:e.best||0,exportedAt:new Date().toISOString()},'mcp-academy-progress.json');
    }
  }
  function refreshAfterChange() {
    try { sessionStorage.setItem('mcp-academy-global-return',JSON.stringify({view:'progress',tab:state.tab})); }catch(_){}
    window.location.reload();
  }
  async function importState(file) {
    try {
      const x=JSON.parse(await file.text());
      if(state.tab==='advanced'){
        if(x.format!=='MCP_Academy_Advanced_Progress'||x.schema!==2||!Array.isArray(x.completed)||!x.completed.every(v=>validIds.advanced.has(v)))throw Error('invalid');
        const prior=read(AKEY);
        const data={...prior,...x,completed:[...new Set(x.completed)],lang:prior.lang||language(),view:'home'};
        localStorage.setItem(AKEY,JSON.stringify(data));
      }else{
        if(x.format!=='MCP_Academy_Progress'||x.schema!==1||!Array.isArray(x.completed)||!x.completed.every(v=>validIds.essentials.has(v))||!validIds.essentials.has(x.lessonId)||!Number.isFinite(x.best)||x.best<0||x.best>100||!Number.isInteger(x.step))throw Error('invalid');
        const prior=read(EKEY);
        const data={...prior,...x,completed:[...new Set(x.completed)],lang:prior.lang||language(),view:'home'};
        localStorage.setItem(EKEY,JSON.stringify(data));
      }
      refreshAfterChange();
    }catch(_) {state.notice=tr('Il file non è un backup valido di questo percorso.','This file is not a valid backup for this track.');render();}
  }
  function resetState() {
    const target=state.tab==='advanced'?'Advanced':'Essentials';
    if(!window.confirm(tr(`Vuoi azzerare soltanto ${target}? L’altro percorso non sarà modificato.`,`Reset only ${target}? The other track will be unaffected.`)))return;
    const key=state.tab==='advanced'?AKEY:EKEY;
    const lang=language();
    const zero=state.tab==='advanced'?{lang,view:'home',lesson:'a1.1',step:0,completed:[],quizzes:{},checks:{},optional:[]}:{lang,view:'home',lessonId:'e1',step:0,completed:[],best:0};
    localStorage.setItem(key,JSON.stringify(zero));
    refreshAfterChange();
  }
  function action(name,element) {
    switch(name) {
      case 'close':case 'back':close();break;
      case 'tab': state.tab=element.dataset.tab;state.notice='';render();document.getElementById('ag-tab-'+state.tab)?.focus();break;
      case 'export':exportState();break;
      case 'import':document.getElementById('ag-import-input')?.click();break;
      case 'reset':resetState();break;
    }
  }
  // Capture global header commands before the individual course's legacy router.
  document.addEventListener('click',event=>{
    // Global tools work from the header, the home hero and either course sidebar.
    const toolButton=event.target.closest('[data-action="search"], [data-action="glossary"], [data-action="progress"], [data-act="search"], [data-act="glossary"], [data-act="progress"]');
    if(toolButton){
      event.preventDefault();event.stopPropagation();
      open(toolButton.dataset.action || toolButton.dataset.act);return;
    }
    const headerButton=event.target.closest('.topbar [data-action], .topbar [data-act]');
    const headerAction=headerButton?.dataset.action||headerButton?.dataset.act;
    if(headerAction==='lang'||headerAction==='language') {
      queueMicrotask(()=>{if(state.view)render();});
    }
    if(headerAction==='home' && state.view)close();
    const within=event.target.closest('#academy-global-ui');
    if(within){
      const btn=event.target.closest('[data-academy]');
      if(btn) {
        if(btn.dataset.academy==='backdrop' && btn!==event.target)return;
        event.preventDefault();event.stopPropagation();action(btn.dataset.academy,btn);
      }
    }
  },true);
  document.addEventListener('input',event=>{
    if(event.target.id==='ag-search-field'){state.search=event.target.value;render('ag-search-field');}
    if(event.target.id==='ag-glossary-field'){state.term=event.target.value;render('ag-glossary-field');}
  },true);
  document.addEventListener('change',event=>{
    if(event.target.id==='ag-import-input'&&event.target.files?.[0])importState(event.target.files[0]);
  },true);
  document.addEventListener('keydown',event=>{
    if(state.view && event.key==='Escape') {event.preventDefault();event.stopPropagation();close();return;}
    const tab=event.target.closest?.('.ag-tabs [role="tab"]');
    if(tab && (event.key==='ArrowLeft'||event.key==='ArrowRight')){
      event.preventDefault();state.tab=state.tab==='advanced'?'essentials':'advanced';render();document.getElementById('ag-tab-'+state.tab)?.focus();
    }
  },true);
  window.addEventListener('storage',event=>{if(state.view && (event.key===EKEY||event.key===AKEY))render();});
  const pending=(()=>{try{const x=JSON.parse(sessionStorage.getItem('mcp-academy-global-return')||'null');sessionStorage.removeItem('mcp-academy-global-return');return x;}catch(_){return null;}})();
  if(pending?.view==='progress') {state.tab=pending.tab==='essentials'?'essentials':'advanced';open('progress');}
})();

</script>
</body>
</html>
