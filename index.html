<script>
/* MCP Academy — educational content. All lesson IDs are locale-independent. */
const ACADEMY_DATA = {
  version: '1.0.0',
  updated: '2026-10-13',
  sources: [
    { id:'mcp', title:'Model Context Protocol — official specification', url:'https://modelcontextprotocol.io/specification/2026-07-28' },
    { id:'arch', title:'MCP — architecture', url:'https://modelcontextprotocol.io/docs/learn/architecture' },
    { id:'tools', title:'MCP — tools specification', url:'https://modelcontextprotocol.io/specification/2026-07-28/server/tools' },
    { id:'autodesk', title:'Autodesk — Revit Public MCP Server', url:'https://help.autodesk.com/view/ADSKMCP/ENU/?guid=ADSKMCP_RevitMcp_revit_mcp_server_html' },
    { id:'setup', title:'Autodesk — Setting Up Revit Public MCP Server', url:'https://help.autodesk.com/view/ADSKMCP/ENU/?guid=ADSKMCP_RevitMcp_setting_up_revit_mcp_server_html' }
  ],
  glossary: [
    { term:'MCP', it:'Model Context Protocol: standard aperto per collegare applicazioni AI a strumenti e dati esterni tramite interfacce definite.', en:'Model Context Protocol: an open standard connecting AI applications to external tools and data through defined interfaces.' },
    { term:'Host', it:'Applicazione che ospita l’esperienza AI e gestisce i collegamenti MCP, ad esempio un’app desktop compatibile.', en:'The application hosting the AI experience and managing MCP connections, such as a compatible desktop app.' },
    { term:'Client', it:'Componente dell’Host che dialoga con un server MCP specifico; non coincide necessariamente con il modello AI.', en:'A component within the host that communicates with a specific MCP server; not necessarily the AI model itself.' },
    { term:'Server', it:'Programma che espone funzionalità o dati mediante MCP e gestisce le richieste del client.', en:'A program exposing functions or data through MCP and handling client requests.' },
    { term:'Tool', it:'Operazione richiamabile attraverso MCP, descritta da nome, parametri e schema.', en:'A callable operation exposed through MCP, described by a name, parameters, and a schema.' },
    { term:'Resource', it:'Contenuto consultabile mediante un URI, reso disponibile da un server.', en:'Readable content identified by a URI and exposed by a server.' },
    { term:'Prompt', it:'Modello di istruzioni riutilizzabile che un server può esporre a un client.', en:'A reusable instruction template that a server can expose to a client.' },
    { term:'Discovery', it:'Procedura con cui un client scopre capacità e strumenti pubblicati da un server.', en:'The process through which a client discovers a server’s capabilities and tools.' },
    { term:'JSON-RPC', it:'Formato di messaggistica strutturata utilizzato dal livello dati di MCP per richieste e risposte.', en:'A structured messaging format used by the MCP data layer for requests and responses.' },
    { term:'STDIO', it:'Trasporto locale che utilizza input e output standard di un processo avviato dal client.', en:'A local transport using the standard input and output of a client-launched process.' },
    { term:'Streamable HTTP', it:'Trasporto MCP basato su richieste HTTP a un endpoint del server.', en:'An MCP transport based on HTTP requests to a server endpoint.' },
    { term:'Revit API', it:'Interfaccia di programmazione di Autodesk Revit per accedere agli elementi e alle funzionalità dell’applicazione.', en:'Autodesk Revit’s programming interface for accessing application elements and operations.' },
    { term:'Read-only', it:'Modalità che permette di leggere informazioni senza modificare il modello.', en:'A mode that permits reading information without changing the model.' }
  ],
  lessons: [
    {
      id:'e1', mins:5, title:{it:'Che cos’è MCP?',en:'What is MCP?'}, subtitle:{it:'Perché collegare l’AI agli strumenti esterni',en:'Why connect AI to external tools'},
      goals:{it:['Distinguere tra spiegare ed eseguire un’operazione','Definire il ruolo dello standard MCP','Riconoscere opportunità e limiti'],en:['Distinguish explaining from executing an action','Define what the MCP standard does','Recognize opportunities and limitations']},
      steps:[
        {id:'e1s1',title:{it:'Il problema da risolvere',en:'The problem we need to solve'},blocks:{
          it:[{type:'p',text:'Immagina di chiedere a un assistente AI: **«Quante pareti ci sono nel mio modello Revit aperto?»**. Senza un collegamento al progetto, l’assistente può spiegarti come contare le pareti, suggerire un abaco o scrivere codice, ma **non può conoscere il numero reale**.'},{type:'p',text:'Per ottenere quel dato deve raggiungere il programma che lo possiede, eseguire un’operazione e ricevere un risultato attendibile. Il problema non è soltanto comprendere il linguaggio naturale: è **collegare due sistemi**.'},{type:'note',title:'Idea chiave',text:'Una risposta ben scritta non equivale a un dato effettivamente letto dal modello BIM.'}],
          en:[{type:'p',text:'Imagine asking an AI assistant: **“How many walls are in my open Revit model?”** Without a connection to your project, the assistant can explain how to count walls, suggest a schedule or write code, but **cannot know the actual count**.'},{type:'p',text:'To obtain that value, it must reach the application holding the data, execute an operation, and receive a trustworthy result. The challenge is not just understanding language: it is **connecting two systems**.'},{type:'note',title:'Key idea',text:'A well-written answer is not the same as data actually retrieved from the BIM model.'}]
        }},
        {id:'e1s2',title:{it:'La definizione di MCP',en:'Defining MCP'},blocks:{
          it:[{type:'p',text:'**Model Context Protocol (MCP)** è uno standard aperto che definisce come un’applicazione possa rendere disponibili strumenti e informazioni a un’altra applicazione, spesso un assistente AI. Consente di scoprire capacità, invocare funzioni e scambiare risultati attraverso messaggi strutturati.'},{type:'p',text:'MCP **non è un modello linguistico**, non è un’applicazione di progettazione e non sostituisce le API di Revit. È la convenzione che permette di comunicare con strumenti già implementati.'},{type:'bullets',items:['Il **client** invia richieste attraverso MCP.','Il **server** espone strumenti e dati.','Il **software esterno** conserva la propria logica e i propri dati.']},{type:'source',ids:['mcp','arch']}],
          en:[{type:'p',text:'**Model Context Protocol (MCP)** is an open standard defining how an application exposes tools and information to another application, often an AI assistant. It supports capability discovery, function calls, and structured responses.'},{type:'p',text:'MCP is **not a language model**, not a design application, and not a replacement for the Revit API. It is the convention used to communicate with capabilities that software already implements.'},{type:'bullets',items:['A **client** sends MCP requests.','A **server** exposes tools and data.','The **external application** retains its own logic and data.']},{type:'source',ids:['mcp','arch']}]
        }},
        {id:'e1s3',title:{it:'Con e senza MCP',en:'With and without MCP'},blocks:{
          it:[{type:'p',text:'Il vantaggio si comprende meglio confrontando la stessa domanda in due situazioni. Usa il selettore qui sotto: è una **simulazione**, non un collegamento a un’AI o a Revit.'},{type:'interactive',widget:'comparison'},{type:'note',title:'Attenzione',text:'Anche quando è disponibile MCP, l’AI può sbagliare la scelta del Tool o interpretare male il risultato. Il dato deve essere verificabile.'}],
          en:[{type:'p',text:'The difference becomes clearer if we compare the same question in two settings. Try the switch below: this is a **simulation**, not an active connection to an AI model or Revit.'},{type:'interactive',widget:'comparison'},{type:'note',title:'Remember',text:'Even with MCP, an AI model may choose the wrong tool or misinterpret its output. The result must remain verifiable.'}]
        }},
        {id:'e1s4',title:{it:'Dove si può utilizzare?',en:'Where can it be used?'},blocks:{
          it:[{type:'p',text:'L’utilità di MCP non si limita al BIM. Un assistente può, tramite server appropriati, interrogare un database, consultare documenti, interagire con strumenti di sviluppo o leggere dati da un modello digitale.'},{type:'bullets',items:['**Documenti:** individuare informazioni in un archivio.','**Database:** eseguire query controllate.','**Sviluppo software:** ispezionare un progetto o avviare test.','**BIM:** recuperare elementi e parametri da Revit.']},{type:'p',text:'Le funzionalità non sono automatiche: dipendono da ciò che **quel particolare server** ha implementato e dai permessi concessi.'}],
          en:[{type:'p',text:'MCP is not limited to BIM. Through suitable servers, an assistant may query a database, read documents, interact with developer tools, or access data from a digital model.'},{type:'bullets',items:['**Documents:** locate information in an archive.','**Databases:** run controlled queries.','**Software development:** inspect a project or run tests.','**BIM:** retrieve Revit elements and parameters.']},{type:'p',text:'These capabilities are not automatic: they depend on what **that specific server** implements and what permissions it has.'}]
        }},
        {id:'e1s5',title:{it:'Cosa ricordare',en:'What to remember'},blocks:{
          it:[{type:'p',text:'MCP è un **ponte standardizzato** fra un’applicazione che vuole usare strumenti e un programma che li rende disponibili. Non trasforma magicamente un LLM in un esperto onnisciente del progetto: apre un canale esplicito per richiedere operazioni.'},{type:'checkpoint',question:'Un MCP Server contiene necessariamente un modello AI?',options:['Sì, sempre','No, può esporre Tools e dati senza contenere un LLM'],correct:1,feedback:'Il server può essere un normale programma che esegue funzioni deterministiche.'}],
          en:[{type:'p',text:'MCP is a **standardized bridge** between an application seeking tools and a program offering them. It does not magically turn an LLM into an all-knowing expert on your project: it opens an explicit channel for requesting operations.'},{type:'checkpoint',question:'Must an MCP server contain an AI model?',options:['Yes, always','No; it can expose tools and data without an LLM'],correct:1,feedback:'A server may simply be a regular program executing deterministic functions.'}]
        }}
      ]
    },
    {
      id:'e2',mins:7,title:{it:'Come funziona MCP?',en:'How does MCP work?'},subtitle:{it:'Host, Client, Server e flusso delle richieste',en:'Host, Client, Server, and request flow'},
      goals:{it:['Identificare Host, Client e Server','Seguire una chiamata dall’utente al risultato','Comprendere l’idea di comunicazione strutturata'],en:['Identify Host, Client, and Server','Follow a call from user to result','Understand structured communication']},
      steps:[
        {id:'e2s1',title:{it:'I tre protagonisti',en:'The three main roles'},blocks:{
          it:[{type:'p',text:'Un’architettura MCP comprende un **Host**, uno o più **Client** gestiti dall’Host e uno o più **Server**. Per esempio, Claude Desktop può agire da Host; un suo client MCP può collegarsi al server locale per Revit.'},{type:'bullets',items:['**Host:** applicazione in cui lavori con l’AI e gestisci le connessioni.','**Client:** componente che dialoga con uno specifico server.','**Server:** programma che pubblica strumenti o risorse.']},{type:'p',text:'Non confondere il **Client** con l’LLM: il modello interpreta richieste, mentre il client implementa la comunicazione con il server.'}],
          en:[{type:'p',text:'An MCP architecture consists of a **Host**, one or more **Clients** managed by that host, and one or more **Servers**. For example, Claude Desktop can be the host, while one of its MCP clients connects to a local server for Revit.'},{type:'bullets',items:['**Host:** the application where you interact with AI and manage connections.','**Client:** the component communicating with a specific server.','**Server:** the program publishing tools or resources.']},{type:'p',text:'Do not confuse the **Client** with the LLM: the model interprets requests, while the client implements communication with the server.'}]
        }},
        {id:'e2s2',title:{it:'Esplora l’architettura',en:'Explore the architecture'},blocks:{
          it:[{type:'p',text:'Seleziona i componenti dello schema per visualizzarne responsabilità e confini. L’applicazione esterna (Revit) non è formalmente un quarto ruolo MCP: è il sistema che il server integra.'},{type:'interactive',widget:'architecture'},{type:'source',ids:['arch']}],
          en:[{type:'p',text:'Select components in the diagram to inspect their responsibilities and boundaries. The external application (Revit) is not a fourth MCP role: it is the system integrated by the server.'},{type:'interactive',widget:'architecture'},{type:'source',ids:['arch']}]
        }},
        {id:'e2s3',title:{it:'Dalla domanda alla risposta',en:'From question to answer'},blocks:{
          it:[{type:'p',text:'Una richiesta pratica attraversa più fasi. Prima il client scopre quali capacità sono disponibili; poi l’AI sceglie, se appropriato, uno strumento. Il client invia una richiesta al server; quest’ultimo esegue l’operazione e restituisce i dati. Infine l’AI li interpreta.'},{type:'bullets',items:['1. L’utente formula una domanda.','2. L’Host dispone della descrizione dei Tools.','3. Il modello sceglie uno strumento e propone gli argomenti.','4. Il client invia la chiamata; il server esegue.','5. Il risultato ritorna all’Host e viene presentato.']},{type:'note',title:'Distinzione importante',text:'Il server esegue l’azione; il modello AI sceglie e interpreta. Non sono lo stesso componente.'}],
          en:[{type:'p',text:'A real request passes through several stages. The client discovers available capabilities; the AI selects a suitable tool, if needed. The client sends a request to the server, which performs the action and returns data. Finally, the AI interprets that result.'},{type:'bullets',items:['1. The user asks a question.','2. The host has descriptions of available tools.','3. The model selects a tool and proposes arguments.','4. The client sends a call; the server performs it.','5. The result returns to the host and is presented.']},{type:'note',title:'Important distinction',text:'The server executes the action; the AI model selects and interprets it. They are different components.'}]
        }},
        {id:'e2s4',title:{it:'Come viaggiano i messaggi',en:'How messages travel'},blocks:{
          it:[{type:'p',text:'MCP utilizza messaggi strutturati basati su **JSON-RPC**. Per trasportarli può utilizzare, tra le altre modalità, **STDIO** per processi locali oppure **Streamable HTTP** attraverso una rete.'},{type:'p',text:'Nel caso del server ufficiale Revit, Autodesk documenta una connessione locale STDIO. Questo significa che il client comunica con un programma eseguito sul computer dell’utente, non direttamente con un server pubblico su Internet.'},{type:'note',title:'Privacy',text:'Server locale non significa necessariamente dati confinati al PC: un client con LLM cloud può inviare al proprio servizio dati restituiti dagli strumenti.'},{type:'source',ids:['mcp','autodesk']}],
          en:[{type:'p',text:'MCP uses structured messages based on **JSON-RPC**. Messages can be carried through transports such as **STDIO** for local processes or **Streamable HTTP** over a network.'},{type:'p',text:'Autodesk documents a local STDIO connection for the official Revit server. The client communicates with a program running on the user’s machine, not directly with a public Internet server.'},{type:'note',title:'Privacy',text:'A local server does not automatically mean all data stays on the PC: a cloud-based LLM client may transmit information returned by tools to its service.'},{type:'source',ids:['mcp','autodesk']}]
        }},
        {id:'e2s5',title:{it:'Riconosci i ruoli',en:'Identify the roles'},blocks:{
          it:[{type:'p',text:'Verifichiamo l’architettura con una domanda semplice. Considera che l’utente sta usando Claude Desktop per interrogare un modello RVT.'},{type:'checkpoint',question:'Quale componente espone le funzioni che permettono di leggere i dati del modello?',options:['MCP Server','LLM','Il testo del prompt'],correct:0,feedback:'È il server MCP a pubblicare strumenti; l’integrazione sottostante interagisce con Revit.'},{type:'p',text:'Nel prossimo modulo vedremo **che cosa** il server può esporre: Tools, Resources e Prompts.'}],
          en:[{type:'p',text:'Let us test the architecture with one question. Imagine a user asking Claude Desktop to inspect an RVT model.'},{type:'checkpoint',question:'Which component exposes the operations for reading model data?',options:['MCP server','LLM','The prompt text'],correct:0,feedback:'The MCP server publishes tools; the underlying integration communicates with Revit.'},{type:'p',text:'Next, we will explore **what** a server can publish: Tools, Resources, and Prompts.'}]
        }}
      ]
    },
    {
      id:'e3',mins:5,title:{it:'Tools, Resources e Prompts',en:'Tools, Resources, and Prompts'},subtitle:{it:'Le tre funzionalità fondamentali esposte dai server',en:'Three core capabilities servers can expose'},
      goals:{it:['Distinguere Tools, Resources e Prompts','Riconoscere esempi concreti','Capire che non tutti i server offrono tutto'],en:['Distinguish tools, resources, and prompts','Recognize real examples','Understand that not all servers offer everything']},
      steps:[
        {id:'e3s1',title:{it:'Tools: eseguire operazioni',en:'Tools: perform operations'},blocks:{
          it:[{type:'p',text:'Un **Tool** è una funzione esposta dal server e richiamabile da un client. Ha un nome, una descrizione e uno schema degli argomenti. Può leggere dati, eseguire calcoli o — se progettato per farlo e autorizzato — modificare informazioni.'},{type:'p',text:'Esempio concettuale: un Tool `count_elements(category)` potrebbe restituire il numero di elementi di una categoria BIM. Il nome è **inventato per la lezione** e non identifica uno specifico Tool Autodesk.'},{type:'note',title:'Non basta chiedere',text:'Un prompt non può aggiungere magicamente un Tool che il server non implementa.'},{type:'source',ids:['tools']}],
          en:[{type:'p',text:'A **Tool** is a server function callable by a client. It has a name, a description, and an argument schema. It may read data, compute results or — if implemented and authorized — modify information.'},{type:'p',text:'Conceptual example: `count_elements(category)` could return the number of BIM elements in a category. This name is **invented for teaching**; it is not a named Autodesk tool.'},{type:'note',title:'A prompt is not enough',text:'A prompt cannot magically add a tool that the server has not implemented.'},{type:'source',ids:['tools']}]
        }},
        {id:'e3s2',title:{it:'Resources: consultare contenuti',en:'Resources: read content'},blocks:{
          it:[{type:'p',text:'Una **Resource** rappresenta un contenuto che il server rende consultabile tramite un identificatore URI. Può essere una descrizione, un file, un documento o un’altra informazione resa disponibile in modo strutturato.'},{type:'p',text:'Per esempio, un server costruito su misura potrebbe esporre `bim://project/summary` per fornire un riepilogo del progetto. Anche questo URI è **dimostrativo**.'},{type:'p',text:'Il punto centrale è la differenza tra **richiamare un’operazione** (Tool) e **consultare un contenuto identificato** (Resource).'}],
          en:[{type:'p',text:'A **Resource** represents content a server makes readable through a URI identifier. This could be a description, file, document, or other structured information.'},{type:'p',text:'For example, a custom-built server might expose `bim://project/summary` as a project summary. This URI is also **illustrative**.'},{type:'p',text:'The key distinction is between **calling an operation** (Tool) and **reading identified content** (Resource).'}]
        }},
        {id:'e3s3',title:{it:'Prompts: istruzioni riutilizzabili',en:'Prompts: reusable instructions'},blocks:{
          it:[{type:'p',text:'Un **Prompt** MCP è un modello di messaggio riutilizzabile che il server può pubblicare. Può aiutare a guidare una specifica attività, eventualmente accettando argomenti.'},{type:'p',text:'Per esempio, un server didattico potrebbe offrire il prompt “Analizza la completezza informativa del progetto” come schema per impostare un’attività di controllo. Questa possibilità dipende dall’implementazione del server.'},{type:'note',title:'Ricorda',text:'Tools, Resources e Prompts sono categorie previste dal protocollo, ma un server concreto può implementarne soltanto alcune.'}],
          en:[{type:'p',text:'An MCP **Prompt** is a reusable message template that a server can publish. It can guide a specific activity and may accept parameters.'},{type:'p',text:'For instance, a teaching server could offer “Review the project’s information completeness” as a template for a checking task. Whether this exists depends on that server’s implementation.'},{type:'note',title:'Remember',text:'Tools, Resources, and Prompts are protocol capabilities, but a real server may implement only some of them.'}]
        }},
        {id:'e3s4',title:{it:'Riconosci la funzionalità',en:'Match the capability'},blocks:{
          it:[{type:'p',text:'Per ciascun esempio, seleziona se rappresenta un Tool, una Resource o un Prompt. Riceverai subito un feedback motivato.'},{type:'interactive',widget:'primitives'}],
          en:[{type:'p',text:'For each scenario, choose whether it represents a Tool, Resource, or Prompt. You will receive explanatory feedback immediately.'},{type:'interactive',widget:'primitives'}]
        }},
        {id:'e3s5',title:{it:'Capacità e autorizzazioni',en:'Capabilities and permissions'},blocks:{
          it:[{type:'p',text:'Scoprire un Tool non significa avere il permesso di utilizzarlo indiscriminatamente. La disponibilità dipende da configurazione, autorizzazioni e regole del sistema ospitante. È particolarmente importante distinguere operazioni **read-only** da operazioni di **scrittura**.'},{type:'p',text:'Quando si lavora su documenti o modelli reali è buona pratica iniziare dalla lettura, ispezionare i risultati e confermare consapevolmente eventuali modifiche.'}],
          en:[{type:'p',text:'Discovering a Tool does not mean it can be used without restrictions. Availability depends on configuration, permissions, and rules enforced by the host environment. Distinguishing **read-only** actions from **write** actions is particularly important.'},{type:'p',text:'With real documents or models, a good practice is to start with reading, inspect outputs, and consciously authorize any changes.'}]
        }}
      ]
    },
    {
      id:'e4',mins:8,title:{it:'MCP applicato a Revit',en:'MCP applied to Revit'},subtitle:{it:'Dal linguaggio naturale ai dati del modello BIM',en:'From natural language to BIM model data'},
      goals:{it:['Spiegare il collegamento MCP–Revit API','Conoscere le capacità principali e i prerequisiti','Seguire una simulazione realistica senza modificare file'],en:['Explain the MCP–Revit API connection','Know main capabilities and prerequisites','Follow a realistic simulation without modifying files']},
      steps:[
        {id:'e4s1',title:{it:'Revit, API e MCP',en:'Revit, API, and MCP'},blocks:{
          it:[{type:'p',text:'Revit contiene oggetti BIM, geometrie e informazioni. La **Revit API** permette a software e add-in di interagire programmaticamente con tali dati. Un server MCP rende disponibili **alcune operazioni implementate** a un client AI, tramite il protocollo MCP.'},{type:'p',text:'Non bisogna pensare a MCP come a una nuova Revit API: è un **livello di collegamento** fra l’applicazione AI e strumenti che interagiscono con Revit.'},{type:'note',title:'Caso reale',text:'I server MCP ufficiali Autodesk sono disponibili in Technical Preview. Questa Academy utilizza Revit 2027.3, la cui compatibilità è stata confermata dall’autore. Le funzioni dipendono dal server installato.'},{type:'source',ids:['autodesk']}],
          en:[{type:'p',text:'Revit contains BIM objects, geometry, and information. The **Revit API** lets software and add-ins interact programmatically with this data. An MCP server makes **certain implemented operations** accessible to an AI client through MCP.'},{type:'p',text:'MCP should not be regarded as a new Revit API: it is a **connection layer** between an AI application and tools integrated with Revit.'},{type:'note',title:'Real-world example',text:'Autodesk provides official MCP servers in Technical Preview. This Academy uses Revit 2027.3, with compatibility confirmed by the course author. Capabilities depend on the installed server.'},{type:'source',ids:['autodesk']}]
        }},
        {id:'e4s2',title:{it:'Di cosa ho bisogno?',en:'What do I need?'},blocks:{
          it:[{type:'p',text:'Per una connessione operativa con il server ufficiale Autodesk servono **Revit 2027.3**, il relativo add-on MCP e un client AI che supporti server MCP locali, per esempio Claude Desktop, configurato correttamente.'},{type:'bullets',items:['1. Revit 2027.3 con un progetto aperto.','2. Revit MCP Server add-on appropriato.','3. Client AI compatibile con MCP locale.','4. Configurazione della connessione al server e verifica.']},{type:'p',text:'Questa lezione **non richiede** di installare nessuno di questi software. La procedura guidata completa è disponibile nel percorso Advanced. Funzionalità e limiti dei client gratuiti possono cambiare nel tempo.'},{type:'source',ids:['setup','autodesk']}],
          en:[{type:'p',text:'To connect through Autodesk’s official server, you need **Revit 2027.3**, the corresponding MCP add-on, and an AI client supporting local MCP servers, such as Claude Desktop, configured correctly.'},{type:'bullets',items:['1. Revit 2027.3 with a project open.','2. The relevant Revit MCP Server add-on.','3. An AI client supporting local MCP.','4. Server connection configuration and verification.']},{type:'p',text:'This lesson **does not require** installing any of these applications. The full hands-on procedure is available in the Advanced track. Free-tier client capabilities and limits may change.'},{type:'source',ids:['setup','autodesk']}]
        }},
        {id:'e4s3',title:{it:'Leggere o modificare?',en:'Read or write?'},blocks:{
          it:[{type:'p',text:'Autodesk distingue tre configurazioni nella Technical Preview: **Read** (interrogazioni senza modifica), **Write** (aggiunge modifiche controllate) ed **Experimental** (aggiunge strumenti sperimentali). Le loro capacità sono cumulative, ma non ogni possibile operazione della Revit API è necessariamente disponibile.'},{type:'bullets',items:['**Read:** cercare elementi, leggere parametri, produrre riepiloghi, navigare nelle viste con i Tools supportati.','**Write:** eseguire modifiche supportate, preferibilmente su copie di lavoro e dopo verifica.','**Experimental:** provare funzionalità meno consolidate, con cautela aggiuntiva.']},{type:'note',title:'Scelta didattica',text:'Nel nostro esempio useremo soltanto una richiesta di lettura, che non modifica il modello.'},{type:'source',ids:['autodesk']}],
          en:[{type:'p',text:'Autodesk distinguishes three Technical Preview options: **Read** (non-mutating queries), **Write** (adds controlled modifications), and **Experimental** (adds experimental tools). Their capabilities are cumulative, but not every operation possible through the Revit API is necessarily available.'},{type:'bullets',items:['**Read:** find elements, inspect parameters, build reports, navigate views using supported tools.','**Write:** perform supported changes, preferably on working copies after review.','**Experimental:** test less mature features with additional caution.']},{type:'note',title:'Teaching choice',text:'Our example uses a read-only request and does not change the model.'},{type:'source',ids:['autodesk']}]
        }},
        {id:'e4s4',title:{it:'Simula una richiesta a Revit',en:'Simulate a Revit request'},blocks:{
          it:[{type:'p',text:'Prova a seguire la richiesta: **«Conta le pareti del modello Revit aperto»**. Il simulatore mostrerà quale componente interviene in ogni fase, quale dato viene scambiato e quando l’AI interpreta il risultato.'},{type:'interactive',widget:'revit'},{type:'warning',title:'Simulazione, non connessione reale',text:'Il numero di elementi e il nome del Tool sono fittizi. Il sito non comunica con Revit e non può verificare il tuo modello.'}],
          en:[{type:'p',text:'Follow this request: **“Count the walls in the open Revit model.”** The simulator shows which component acts at each stage, what information is exchanged, and when the AI interprets the result.'},{type:'interactive',widget:'revit'},{type:'warning',title:'Simulation, not a live connection',text:'The element count and tool name are invented. This website does not communicate with Revit and cannot inspect your model.'}]
        }},
        {id:'e4s5',title:{it:'Possibilità e limiti',en:'Possibilities and limits'},blocks:{
          it:[{type:'p',text:'Un MCP per Revit può diventare utile per interrogazioni guidate, analisi di parametri, report e operazioni supportate di editing. Però la qualità della risposta dipende da **dati del modello**, **Tools disponibili**, **argomenti richiesti** e **interpretazione dell’AI**.'},{type:'p',text:'Nel BIM una verifica è essenziale: un risultato apparentemente plausibile non prova che il dato provenga dal modello giusto, dalla categoria corretta o dal parametro previsto.'},{type:'checkpoint',question:'Qual è la scelta più prudente per una prima prova su Revit?',options:['Eseguire una modifica massiva su un progetto reale','Interrogare elementi in modalità Read e verificare il risultato'],correct:1,feedback:'Le richieste read-only permettono di verificare connessione e dati senza alterare il modello.'}],
          en:[{type:'p',text:'MCP for Revit can support guided queries, parameter analysis, reports, and supported editing operations. However, output quality depends on **model data**, **available tools**, **call arguments**, and **AI interpretation**.'},{type:'p',text:'Verification matters in BIM: a plausible response does not prove that data came from the correct model, category, or parameter.'},{type:'checkpoint',question:'What is the safest way to start testing MCP with Revit?',options:['Make bulk edits to a live project','Query elements using Read tools and verify the results'],correct:1,feedback:'Read-only calls let you verify connectivity and data without altering the model.'}]
        }}
      ]
    },
    {
      id:'e5',mins:5,title:{it:'Verifica e prossimi passi',en:'Review and next steps'},subtitle:{it:'Consolida le conoscenze in 10 domande',en:'Consolidate your knowledge with 10 questions'},
      goals:{it:['Riconoscere i concetti principali','Verificare la comprensione con soglia 80%','Sapere dove proseguire'],en:['Recognize key concepts','Test understanding with an 80% passing threshold','Know where to go next']},
      steps:[
        {id:'e5s1',title:{it:'La mappa concettuale',en:'The concept map'},blocks:{
          it:[{type:'p',text:'Hai visto il quadro generale: l’**Host** ospita l’esperienza AI, il **Client** parla con il **Server**, il Server espone Tools/Resources/Prompts e può integrare applicazioni come **Revit**. Il protocollo standardizza le comunicazioni, ma non sostituisce le API.'},{type:'bullets',items:['**MCP:** linguaggio comune per le integrazioni.','**Tool:** operazione disponibile, con argomenti definiti.','**Revit:** dati e operazioni reali, accessibili soltanto attraverso strumenti implementati.','**Verifica:** l’output AI va controllato rispetto alla fonte.']},{type:'note',title:'Obiettivo della prova',text:'Dimostrare la comprensione dei concetti, non memorizzare dettagli di codice.'}],
          en:[{type:'p',text:'You now have the big picture: the **Host** runs the AI experience, the **Client** talks to the **Server**, the server exposes Tools/Resources/Prompts, and may integrate applications like **Revit**. MCP standardizes communication but does not replace APIs.'},{type:'bullets',items:['**MCP:** a shared protocol for integrations.','**Tool:** an available operation with defined arguments.','**Revit:** real data and operations, accessible only via implemented tools.','**Verification:** AI outputs should be checked against the source.']},{type:'note',title:'Assessment goal',text:'Show conceptual understanding, not memorize code details.'}]
        }},
        {id:'e5s2',title:{it:'Quiz finale: 10 domande',en:'Final quiz: 10 questions'},blocks:{
          it:[{type:'p',text:'Rispondi alle 10 domande. Serve almeno l’**80%** per superare la verifica. Puoi ripeterla senza limiti: ogni risposta sarà accompagnata da una spiegazione. Il punteggio migliore resta salvato in questo browser.'},{type:'interactive',widget:'quiz'}],
          en:[{type:'p',text:'Answer 10 questions. You need at least **80%** to pass. You can retry without limits; each answer comes with an explanation. Your best score is saved in this browser.'},{type:'interactive',widget:'quiz'}]
        }},
        {id:'e5s3',title:{it:'Cosa hai imparato',en:'What you have learned'},blocks:{
          it:[{type:'p',text:'Se ora sai spiegare **perché MCP esiste**, distinguere Host/Client/Server, riconoscere Tools/Resources/Prompts e seguire il flusso di una richiesta Revit, hai raggiunto l’obiettivo di Essentials.'},{type:'p',text:'Il percorso **Advanced** è ora disponibile come corso distinto di MCP Academy. Include configurazione reale, laboratori sul modello Revit 2027 e sviluppo di un MCP personalizzato. Per il momento non sono necessarie installazioni.'},{type:'note',title:'Per continuare autonomamente',text:'Puoi riaprire qualsiasi passaggio, consultare il glossario o seguire i riferimenti ufficiali indicati nelle lezioni.'}],
          en:[{type:'p',text:'If you can now explain **why MCP exists**, distinguish Host/Client/Server, recognize Tools/Resources/Prompts, and follow a Revit request, you have reached the Essentials learning goal.'},{type:'p',text:'The **Advanced** track is now available as a separate course. It includes real setup, Revit 2027 model labs, and custom MCP development. No installation is needed at this stage.'},{type:'note',title:'Continue learning',text:'You can revisit any step, consult the glossary, or follow the official references attached to lessons.'}]
        }}
      ]
    }
  ],
  quiz:[
    {q:{it:'Che cosa rappresenta MCP?',en:'What does MCP stand for?'},a:{it:['Un modello AI specializzato','Uno standard per collegare applicazioni e strumenti','Un nuovo formato di file BIM'],en:['A specialized AI model','A standard for connecting applications and tools','A new BIM file format']},correct:1,why:{it:'MCP è un protocollo aperto di integrazione; non è un LLM né un formato RVT/IFC.',en:'MCP is an open integration protocol, not an LLM or an RVT/IFC file format.'}},
    {q:{it:'Un assistente senza accesso al tuo modello può sapere il numero reale di pareti?',en:'Can an assistant without access to your model know its actual wall count?'},a:{it:['No, può soltanto ipotizzare o spiegare come ottenerlo','Sì, perché conosce già Revit','Sì, leggendo automaticamente il PC'],en:['No; it can only guess or explain how to obtain it','Yes, because it knows Revit','Yes, by automatically reading the PC']},correct:0,why:{it:'Senza strumenti o dati forniti, non può leggere autonomamente il progetto.',en:'Without tools or supplied data, it cannot inspect the project.'}},
    {q:{it:'Quale ruolo svolge un MCP Server?',en:'What does an MCP server do?'},a:{it:['Ospita obbligatoriamente il modello AI','Espone strumenti e dati tramite MCP','Sostituisce tutte le API esterne'],en:['Always hosts the AI model','Exposes tools and data through MCP','Replaces all external APIs']},correct:1,why:{it:'Un server pubblica capacità implementate; normalmente si integra con API esistenti.',en:'A server publishes implemented capabilities and often integrates existing APIs.'}},
    {q:{it:'Che differenza c’è fra MCP Host e MCP Client?',en:'How do MCP Host and MCP Client differ?'},a:{it:['Sono sempre sinonimi','L’Host gestisce l’esperienza AI; il Client comunica con un server','Il Client è sempre il modello LLM'],en:['They are always synonymous','The host manages the AI experience; the client talks to a server','The client is always the LLM']},correct:1,why:{it:'L’Host contiene/gestisce i client per le diverse connessioni.',en:'The host manages clients for different server connections.'}},
    {q:{it:'Qual è un esempio di MCP Tool?',en:'Which is an example of an MCP tool?'},a:{it:['Una funzione che legge elementi del modello','La definizione di un termine nel glossario','Un testo introduttivo statico'],en:['A function that reads model elements','A glossary definition','A static introduction paragraph']},correct:0,why:{it:'Il Tool è un’operazione richiamabile con nome e argomenti.',en:'A tool is a callable operation with a name and arguments.'}},
    {q:{it:'Quale elemento descrive meglio una Resource?',en:'Which best describes a Resource?'},a:{it:['Un contenuto consultabile identificato da URI','Un comando per modificare una parete','Il modello linguistico'],en:['Readable content identified by a URI','A command to modify a wall','The language model']},correct:0,why:{it:'Una Resource rende accessibili contenuti, non è necessariamente un’operazione.',en:'A resource makes content readable; it is not necessarily an operation.'}},
    {q:{it:'Cosa rappresenta un MCP Prompt?',en:'What is an MCP Prompt?'},a:{it:['Un modello di istruzioni riutilizzabile','Un server HTTP','Un file RVT'],en:['A reusable instruction template','An HTTP server','An RVT file']},correct:0,why:{it:'I prompt MCP sono modelli di messaggi che un server può esporre.',en:'MCP prompts are message templates a server can expose.'}},
    {q:{it:'Quale relazione è corretta tra MCP e Revit API?',en:'Which statement about MCP and the Revit API is correct?'},a:{it:['MCP sostituisce completamente la Revit API','MCP può esporre funzioni implementate tramite la Revit API','MCP converte automaticamente un RVT in IFC'],en:['MCP completely replaces the Revit API','MCP can expose functions implemented using the Revit API','MCP automatically converts an RVT to IFC']},correct:1,why:{it:'Il server collega l’applicazione AI a operazioni software; l’API continua a fare il lavoro su Revit.',en:'The server links AI applications to software actions; the API still performs Revit operations.'}},
    {q:{it:'Quale versione di Revit utilizza questa Academy per gli esercizi MCP?',en:'Which Revit version is used for MCP exercises in this Academy?'},a:{it:['Revit 2024 senza aggiornamenti','Revit 2027.3','Qualsiasi versione di Revit'],en:['Revit 2024 without updates','Revit 2027.3','Any Revit version']},correct:1,why:{it:'Il corso è progettato per Revit 2027.3, la cui compatibilità è stata confermata dall’autore.',en:'The course targets Revit 2027.3, with compatibility confirmed by the course author.'}},
    {q:{it:'Qual è il comportamento più corretto dopo una risposta MCP su dati BIM?',en:'What should you do after an MCP-generated response about BIM data?'},a:{it:['Accettarla sempre come corretta','Verificarne fonte, oggetti e valori','Assumere che ogni Tool possa modificare il progetto'],en:['Always accept it as correct','Verify the source, objects, and values','Assume every tool can modify the project']},correct:1,why:{it:'Il modello AI può scegliere strumenti o interpretare dati in modo scorretto: i risultati vanno verificati.',en:'AI models can select inappropriate tools or misinterpret data: verify outputs.'}}
  ]
};

/* MCP Academy — standalone application, no network calls or paid services. */
(function () {
  'use strict';
  const D = ACADEMY_DATA;
  const KEY = 'mcp-academy-progress-v1';
  const empty = () => ({ lang: 'it', view: 'home', lessonId: 'e1', step: 0, completed: [], best: 0 });
  let state = load();
  const ui = { arch: 'host', comparison: 'without', primitive: 0, primitiveAnswers: {}, simulation: 0, checkpoint: {}, quizAnswers: {}, quizSubmitted: false, search:'', glossary:'', modal: null, menu:false, toast:'' };
  let toastTimer;
  const root = document.getElementById('app');

  function load() {
    try {
      const data = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (data && ['it','en'].includes(data.lang) && Array.isArray(data.completed)) {
        const validIds = D.lessons.map(l=>l.id);
        return { lang: data.lang, view: 'home', lessonId: validIds.includes(data.lessonId) ? data.lessonId : 'e1', step: Number.isInteger(data.step) ? Math.max(0,data.step) : 0, completed: data.completed.filter(x=>validIds.includes(x)), best: Number.isFinite(data.best) ? Math.max(0,Math.min(100,data.best)) : 0 };
      }
    } catch(e) { /* storage can be blocked */ }
    return empty();
  }
  function save() {
    try { localStorage.setItem(KEY,JSON.stringify({lang:state.lang,lessonId:state.lessonId,step:state.step,completed:state.completed,best:state.best,updated:new Date().toISOString()})); } catch(e) { /* best effort; export stays available */ }
  }
  const copy = {

    {label:{it:'Scelta dello strumento',en:'Tool selection'},msg:{it:'Il modello AI identifica un Tool capace di recuperare elementi BIM.',en:'The AI model identifies a tool for retrieving BIM elements.'},who:'AI HOST'},
    {label:{it:'Chiamata MCP',en:'MCP tool call'},msg:{it:'Il client invia una richiesta con il nome e gli argomenti del Tool.',en:'The client sends a request with a tool name and arguments.'},who:'MCP CLIENT'},
    {label:{it:'Risposta dal modello',en:'Model response'},msg:{it:'Il server interroga Revit tramite l’integrazione disponibile e restituisce un risultato di esempio.',en:'The server queries Revit through its integration and returns an illustrative result.'},who:'MCP SERVER → REVIT'},
    {label:{it:'Interpretazione finale',en:'Final interpretation'},msg:{it:'L’AI presenta il conteggio, specificandone il contesto e permettendo una verifica.',en:'The AI presents the count, with its context and a way to verify it.'},who:'AI HOST'}
  ];
  const demoJson=[ 'Count all walls in the open Revit model.', 'Select available read-only tool for category query.', '{"method":"tools/call","params":{"name":"demo_list_elements","arguments":{"category":"Walls"}}}', '{"category":"Walls","count":125}', 'Example answer: 125 walls (SIMULATED DATA).' ];
  function revitWidget(){let i=ui.simulation,step=simSteps[i];return `<section class="widget revit-widget"><div class="widget-head"><span class="widget-label">INTERACTIVE / 04 · REVIT</span><span class="widget-small">${t('step')} ${i+1} / 5</span></div><div class="sim-timeline">${simSteps.map((s,j)=>`<button class="sim-dot ${i===j?'active':''} ${j<i?'past':''}" data-action="simGo" data-index="${j}" aria-label="${t('step')} ${j+1}: ${esc(txt(s.label))}">${j<i?icon('check',14):j+1}</button>`).join('')}</div><div class="sim-content"><span class="micro-label">${step.who}</span><h3>${esc(txt(step.label))}</h3><p>${esc(txt(step.msg))}</p><pre><code>${esc(i===0?(state.lang==='it'?'Conta le pareti del modello Revit aperto.':demoJson[0]):i===4?(state.lang==='it'?'Risposta di esempio: 125 pareti (DATI SIMULATI).':demoJson[4]):demoJson[i])}</code></pre></div><div class="widget-controls"><button class="btn btn-outline btn-small" data-action="simPrev" ${i===0?'disabled':''}>${icon('back',16)} ${t('previous')}</button><button class="btn btn-primary btn-small" data-action="simNext">${i===4?t('simRestart'):t('simNext')} ${icon(i===4?'rotate':'arrow',16)}</button></div><p class="sim-notice">${icon('info',15)} ${t('disclaimer')}</p></section>`}
  function quizWidget() {let all=D.quiz.length,answered=Object.keys(ui.quizAnswers).length,submitted=ui.quizSubmitted,score=D.quiz.filter((q,i)=>ui.quizAnswers[i]===q.correct).length, percent=Math.round(score/all*100),passed=percent>=80;return `<section class="quiz-section"><div class="quiz-head"><div><span class="widget-label">FINAL ASSESSMENT</span><h3>${t('quizScore')}</h3></div><span class="quiz-count">${submitted?`${percent}%`:`${answered} / ${all}`}</span></div><div class="quiz-questions">${D.quiz.map((q,i)=>`<fieldset class="quiz-question"><legend><span>${String(i+1).padStart(2,'0')}</span> ${esc(txt(q.q))}</legend><div class="quiz-options">${q.a[state.lang].map((answer,j)=>`<label class="quiz-option ${submitted&&q.correct===j?'answer-right':''} ${submitted&&ui.quizAnswers[i]===j&&q.correct!==j?'answer-wrong':''}"><input type="radio" name="quiz${i}" value="${j}" data-quiz-index="${i}" ${ui.quizAnswers[i]===j?'checked':''} ${submitted?'disabled':''}><span>${esc(answer)}</span></label>`).join('')}</div>${submitted?`<div class="quiz-explain"><strong>${ui.quizAnswers[i]===q.correct?'✓':'×'} ${t('correction')}:</strong> ${esc(txt(q.why))}</div>`:''}</fieldset>`).join('')}</div>${submitted?`<div class="quiz-result ${passed?'passed':''}"><div class="result-score">${percent}%</div><div><strong>${passed?t('success'):t('failed')}</strong><p>${t('quizBest')}: ${Math.max(state.best,percent)}% · ${t('saveInfo')}</p></div></div><button class="btn btn-outline" data-action="quizRetry">${icon('rotate',17)} ${t('restart')}</button>`:`<div class="quiz-actions"><span>${answered}/${all} ${t('chooseOne').toLowerCase()}</span><button class="btn btn-primary" data-action="quizSubmit" ${answered<all?'disabled':''}>${t('quizCheck')} ${icon('check',17)}</button></div>`}</section>`}
  function renderWidget(widget){return ({comparison,architecture,primitives:primitivesWidget,revit:revitWidget,quiz:quizWidget})[widget]?.()||''}
  function reader(){let lesson=currentLesson(),lessonIndex=D.lessons.indexOf(lesson),step=lesson.steps[state.step]||lesson.steps[0],last=state.step===lesson.steps.length-1,finished=state.completed.includes(lesson.id),canFinish=lesson.id!=='e5'||state.best>=80;
    return `<main class="reader"><div class="reader-layout">${sidebar()}<section class="reading" id="lesson-main"><div class="reader-crumb"><span>ESSENTIALS</span><span class="crumb-sep">/</span><span>${String(lessonIndex+1).padStart(2,'0')}</span><span class="crumb-sep">/</span><strong>${esc(txt(lesson.title))}</strong></div><div class="lesson-cover"><div class="lesson-meta"><span>${t('course')} 01 / ${t('lessons')} ${lessonIndex+1}</span><span>${icon('clock',16)} ${lesson.mins} min</span></div><h1>${esc(txt(lesson.title))}</h1><p>${esc(txt(lesson.subtitle))}</p><details class="learning-goals"><summary>${icon('award',18)} ${t('goals')}</summary><ul>${lesson.goals[state.lang].map(goal=>`<li>${esc(goal)}</li>`).join('')}</ul></details></div><div class="stepbar"><div class="step-status"><span>${t('step')} ${state.step+1} ${t('of')} ${lesson.steps.length}</span><strong>${esc(txt(step.title))}</strong></div><div class="step-dots">${lesson.steps.map((s,i)=>`<button class="step-pill ${i===state.step?'current':''}" data-action="step" data-index="${i}" ${i===state.step?'aria-current="step"':''} title="${esc(txt(s.title))}" aria-label="${t('step')} ${i+1}: ${esc(txt(s.title))}">${i+1}</button>`).join('')}</div></div><article class="lesson-article"><div class="step-kicker">${t('step')} ${String(state.step+1).padStart(2,'0')} / ${String(lesson.steps.length).padStart(2,'0')}</div><h2>${esc(txt(step.title))}</h2><div class="prose">${step.blocks[state.lang].map(renderBlock).join('')}</div></article><div class="lesson-bottom"><div class="lesson-bottom-head">${finished?`<span class="completion done">${icon('check',17)} ${t('finished')}</span>`:`<span class="completion">${icon('book',17)} ${t('notYet')}</span>`}<button class="link-btn" data-action="print">${icon('print',16)} ${t('print')}</button></div><div class="lesson-controls"><button class="btn btn-outline" data-action="previous" ${lessonIndex===0&&state.step===0?'disabled':''}>${icon('back',18)} ${t('previous')}</button><div class="right-controls">${last&&!finished?`<button class="btn btn-soft" data-action="finish" ${!canFinish?'disabled':''}>${t('finish')} ${icon('check',17)}</button>`:''}${!last||lessonIndex<D.lessons.length-1?`<button class="btn btn-primary" data-action="next">${last?t('nextLesson'):t('next')} ${icon('arrow',18)}</button>`:''}</div></div>${last&&!canFinish?`<p class="finish-note">${t('passFirst')}</p>`:''}</div><div class="reader-outro">${t('version')} · <button data-action="sources">${t('sources')} ↗</button></div></section></div></main>`}
  function searchPage(){const q=ui.search.trim().toLowerCase();let matches=[];for(let l of D.lessons){for(let i=0;i<l.steps.length;i++){const s=l.steps[i];const summary=s.blocks[state.lang].filter(b=>b.type==='p').map(b=>b.text).join(' ');const val=[txt(l.title),txt(s.title),summary].join(' ').toLowerCase();if(!q||val.includes(q)) matches.push({l,s,i,summary});}}return `<main class="utility-page"><button class="back-link" data-action="resume">${icon('back',16)} Essentials</button><div class="utility-head"><span class="section-label">INDEX / SEARCH</span><h1>${t('search')}</h1><p>${t('searchHint')}</p></div><label class="search-wrap">${icon('search',21)}<input id="site-search" type="search" autocomplete="off" placeholder="${t('searchPlaceholder')}" value="${esc(ui.search)}" aria-label="${t('search')}"/></label><div class="search-results">${matches.length?matches.map(x=>`<button class="search-result" data-action="goto" data-id="${x.l.id}" data-index="${x.i}"><span>${esc(txt(x.l.title))} / ${x.i+1}</span><strong>${esc(txt(x.s.title))}</strong><p>${esc(x.summary.replace(/\*\*/g,'').slice(0,170))}…</p>${icon('arrow',18)}</button>`).join(''):`<p class="empty-state">${t('searchEmpty')}</p>`}</div></main>`}
  function sourcesPage(){return `<main class="utility-page"><button class="back-link" data-action="resume">${icon('back',16)} Essentials</button><div class="utility-head"><span class="section-label">REFERENCES</span><h1>${t('sources')}</h1><p>${t('sourceIntro')}</p></div><div class="reference-list">${D.sources.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer"><div>${icon('file',20)}<span>${esc(s.title)}</span></div>${icon('arrow',18)}</a>`).join('')}</div><p class="offline-hint">${t('offline')}</p></main>`}
  function progressPage(){return `<main class="utility-page"><button class="back-link" data-action="resume">${icon('back',16)} Essentials</button><div class="utility-head"><span class="section-label">YOUR LEARNING</span><h1>${t('progressLink')}</h1><p>${t('backup')}</p></div><div class="progress-summary"><div class="progress-ring" style="--p:${progress()}%"><div><strong>${progress()}%</strong><span>Essentials</span></div></div><div class="summary-stats"><div><span>${t('lessons')} ${t('done')}</span><strong>${state.completed.length} / ${D.lessons.length}</strong></div><div><span>${t('quizBest')}</span><strong>${state.best}%</strong></div><div><span>${t('passed')}</span><strong>${state.best>=80?'✓':'—'}</strong></div></div></div><div class="progress-lessons">${D.lessons.map((l,i)=>`<button data-action="lesson" data-id="${l.id}"><span class="status-round ${state.completed.includes(l.id)?'checked':''}">${state.completed.includes(l.id)?icon('check',15):i+1}</span><span>${esc(txt(l.title))}</span><strong>${state.completed.includes(l.id)?t('finished'):t('notYet')}</strong>${icon('arrow',17)}</button>`).join('')}</div><div class="data-controls"><button class="btn btn-outline" data-action="export">${icon('download',17)} ${t('export')}</button><button class="btn btn-outline" data-action="import">${icon('upload',17)} ${t('import')}</button><button class="btn btn-danger" data-action="reset">${icon('rotate',17)} ${t('reset')}</button><input type="file" id="import-file" accept="application/json,.json" hidden /></div></main>`}
  function modal(){if(ui.modal!=='glossary')return '';let q=ui.glossary.trim().toLowerCase();let items=D.glossary.filter(g=>(g.term+' '+g[state.lang]).toLowerCase().includes(q));return `<div class="modal-backdrop" data-action="closeBackdrop"><div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="glossary-title"><div class="modal-head"><div><span class="section-label">REFERENCE</span><h2 id="glossary-title">${t('glossary')}</h2><p>${t('glossaryHint')}</p></div><button data-action="closeModal" class="close-btn" aria-label="${t('hide')}">${icon('close')}</button></div><label class="search-wrap">${icon('search',20)}<input id="glossary-search" type="search" value="${esc(ui.glossary)}" placeholder="${t('glossaryPlaceholder')}" aria-label="${t('glossary')}"/></label><div class="glossary-list">${items.length?items.map(g=>`<div class="glossary-item"><h3>${esc(g.term)}</h3><p>${esc(g[state.lang])}</p></div>`).join(''):`<p class="empty-state">${t('noTerm')}</p>`}</div></div></div>`}
  function render(){document.documentElement.lang=state.lang; document.title = state.view==='course'?`${txt(currentLesson().title)} — MCP Academy`:'MCP Academy — Essentials';root.innerHTML=header()+(state.view==='home'?home():state.view==='course'?reader():state.view==='search'?searchPage():state.view==='progress'?progressPage():state.view==='sources'?sourcesPage():home())+footer()+modal()+(ui.toast?`<div class="toast" role="status">${icon('check',18)} ${esc(ui.toast)}</div>`:'');}
  function action(name,el){switch(name){
    case 'home':state.view='home';ui.menu=false;save();render();scrollTop();break;
    case 'resume':gotoLesson(state.lessonId,state.step);break;
    case 'lesson':gotoLesson(el.dataset.id,0);break;
    case 'goto':gotoLesson(el.dataset.id,Number(el.dataset.index));break;
    case 'step':state.step=Number(el.dataset.index);save();render();scrollTop();break;
    case 'next':{let l=currentLesson(),i=D.lessons.indexOf(l);if(state.step<l.steps.length-1)state.step++;else if(i<D.lessons.length-1){state.lessonId=D.lessons[i+1].id;state.step=0;}save();render();scrollTop();break;}
    case 'previous':{let l=currentLesson(),i=D.lessons.indexOf(l);if(state.step>0)state.step--;else if(i>0){let prev=D.lessons[i-1];state.lessonId=prev.id;state.step=prev.steps.length-1;}save();render();scrollTop();break;}
    case 'finish':if(state.lessonId==='e5'&&state.best<80){showToast(t('passFirst'));break;}if(!state.completed.includes(state.lessonId))state.completed.push(state.lessonId);save();showToast(t('lessonDone'));break;
    case 'lang':state.lang=el.dataset.value;save();render();break;
    case 'search':state.view='search';ui.search='';render();scrollTop();document.getElementById('site-search')?.focus();break;
    case 'sources':state.view='sources';render();scrollTop();break;
    case 'glossary':ui.modal='glossary';ui.glossary='';render();document.getElementById('glossary-search')?.focus();break;
    case 'progress':state.view='progress';render();scrollTop();break;
    case 'closeModal':
    case 'closeBackdrop':ui.modal=null;render();break;
    case 'toggleMenu':ui.menu=!ui.menu;render();break;
    case 'compare':ui.comparison=el.dataset.value;render();break;
    case 'arch':ui.arch=el.dataset.value;render();break;
    case 'primitiveChoose':ui.primitiveAnswers[ui.primitive]=el.dataset.value;render();break;
    case 'primitiveNext':ui.primitive=Math.min(2,ui.primitive+1);render();break;
    case 'primitivePrev':ui.primitive=Math.max(0,ui.primitive-1);render();break;
    case 'simGo':ui.simulation=Number(el.dataset.index);render();break;
    case 'simPrev':ui.simulation=Math.max(0,ui.simulation-1);render();break;
    case 'simNext':ui.simulation=(ui.simulation+1)%5;render();break;
    case 'checkpoint':ui.checkpoint[el.dataset.id]=Number(el.dataset.index);render();break;
    case 'quizSubmit':if(Object.keys(ui.quizAnswers).length<D.quiz.length){showToast(t('quizMissing'));break;}ui.quizSubmitted=true;let percent=Math.round(D.quiz.filter((q,i)=>ui.quizAnswers[i]===q.correct).length*100/D.quiz.length);state.best=Math.max(state.best,percent);save();render();break;
    case 'quizRetry':ui.quizAnswers={};ui.quizSubmitted=false;render();break;
    case 'export':{const payload={format:'MCP_Academy_Progress',schema:1,...state,view:undefined,exportedAt:new Date().toISOString()};let blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mcp-academy-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);break;}
    case 'import':document.getElementById('import-file')?.click();break;
    case 'reset':if(window.confirm(t('resetConfirm'))){let lng=state.lang;state=empty();state.lang=lng;save();render();}break;
    case 'print':window.print();break;
  }}
  document.addEventListener('click',e=>{let el=e.target.closest('[data-action]');if(el){if(el.dataset.action==='closeBackdrop' && e.target!==el)return;e.preventDefault();action(el.dataset.action,el);}});
  document.addEventListener('input',e=>{if(e.target.id==='site-search'){let pos=e.target.selectionStart;ui.search=e.target.value;render();let inp=document.getElementById('site-search');inp?.focus();inp?.setSelectionRange(pos,pos);}if(e.target.id==='glossary-search'){let pos=e.target.selectionStart;ui.glossary=e.target.value;render();let inp=document.getElementById('glossary-search');inp?.focus();inp?.setSelectionRange(pos,pos);}});
  document.addEventListener('change',async e=>{if(e.target.matches('input[data-quiz-index]')){ui.quizAnswers[Number(e.target.dataset.quizIndex)]=Number(e.target.value);render();} if(e.target.id==='import-file'&&e.target.files?.[0]){try{let imported=JSON.parse(await e.target.files[0].text());const ids=D.lessons.map(l=>l.id);if(imported.format!=='MCP_Academy_Progress'||imported.schema!==1||!Array.isArray(imported.completed)||!imported.completed.every(id=>ids.includes(id))||!Number.isFinite(imported.best)||imported.best<0||imported.best>100||!ids.includes(imported.lessonId)||!Number.isInteger(imported.step))throw new Error('invalid');state.completed=[...new Set(imported.completed)];state.best=imported.best;state.lessonId=imported.lessonId;state.step=Math.max(0,Math.min(imported.step,currentLesson().steps.length-1));save();showToast(t('imported'));}catch(err){showToast(t('invalid'));}e.target.value='';}});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal){ui.modal=null;render();}});
  render();
})();

</script>
</body>
</html>
